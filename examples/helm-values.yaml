# Example production values for the orchestrator Helm chart.
#
#   helm install orchestrator oci://ghcr.io/open-runtimes/charts/orchestrator \
#     --version <X.Y.Z> -n orchestrator --create-namespace -f helm-values.yaml
#
# Everything here layers on top of charts/orchestrator/values.yaml (the full
# annotated reference). This example enables the serving plane with a real
# domain, the hardened workload namespace, warm pools, and an HA control
# plane. Prerequisites: K8s 1.29+, the Gateway API CRDs, and a gateway
# controller with Extended features (Traefik, Envoy Gateway, Istio) — see
# docs/operations.md.

# Every component is opt-in; this example enables both planes.
jobs:
  enabled: true

  # Publicly expose the jobs API via Gateway API. You own the Gateway
  # (listener config, TLS, load balancer) as with deployments.gateway below —
  # omit jobs.gateway and set jobs.httpRoute.parentRefs instead to attach to
  # one you already manage.
  gateway:
    enabled: true
    gatewayClassName: traefik
    listeners:
      - name: web
        port: 8000
        protocol: HTTP
        allowedRoutes:
          namespaces: { from: Same }
  httpRoute:
    enabled: true
    hostnames:
      - jobs.example.com

# Run workload pods in their own hardened namespace: restricted Pod Security
# admission, default-deny NetworkPolicy (requires an enforcing CNI), the
# cloud-metadata egress block, and a capacity quota. This is chart-global
# because deployment and sandbox workloads share it.
workloadNamespace:
  enabled: true
  podSecurity: restricted
  networkPolicy:
    enabled: true
    gatewayNamespace: traefik-system # where your gateway controller runs
  resourceQuota:
    enabled: true
    pods: 200
    requestsCpu: "100"
    requestsMemory: 200Gi

# ── Serving plane ────────────────────────────────────────────────────────────
deployments:
  enabled: true

  # Deployments get hosts like {id}.apps.example.com; point a wildcard DNS
  # record for this domain at your gateway's address.
  domain: apps.example.com

  # The Gateway resource HTTPRoutes attach to. You create and own it
  # (listeners, TLS, load balancer) — see docs/operations.md for an example.
  gateway:
    enabled: true
    name: orchestrator
    namespace: "" # empty = release namespace

  # Warm pools: standing capacity automatically matched to complete deployment
  # specs by fixed image/port/resources/shape (docs/pools.md). Resize with a
  # values change + helm upgrade; clients never name these ids.
  pools:
    - id: py
      image: python:3.12-slim
      size: 4
      port: 8000 # required — the container port pooled Revisions serve on
      cpu: 1
      memory: 512
      burst: reject # no free pod → direct fallback; default "cold" creates on demand
    - id: node
      image: node:22-slim
      size: 2
      port: 3000
      cpu: 1
      memory: 512

  # CPU is compressible: request = limit / overcommit, no CPU limit.
  # 2 packs workloads twice as dense at the cost of contention under load.
  cpuOvercommit: 2

  # Default requests for workload containers that declare none.
  limitRange:
    enabled: true

  # HA control plane: every replica serves the API; the background
  # reconcilers (auto-cut, endpoint flip, autoscaler, pools) run on the
  # elected leader. leaderElection is required when replicaCount > 1 (the
  # chart fails at render time otherwise). Multi-replica components get a
  # PodDisruptionBudget automatically.
  replicaCount: 2
  leaderElection:
    enabled: true

  # The buffering edge for cold-start and async traffic — autoscaled on CPU.
  # Required for scale-to-zero and async requests.
  activator:
    enabled: true
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80

# ── Autoscaler tuning + API auth (both services) ─────────────────────────────
extraEnv:
  # Concurrency window: shorter reacts faster, both up and down.
  - name: AUTOSCALER_WINDOW
    value: 60s
  # Require `Authorization: Bearer <key>` on the APIs. Mount the secret via
  # your pod-level tooling (extraEnv + CSI/operator of choice); with no key
  # configured the API is open and the services log a warning.
  # - name: API_KEY_FILE
  #   value: /run/secrets/orchestrator/api-key

resources:
  requests:
    cpu: 100m
    memory: 128Mi
