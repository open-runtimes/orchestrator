name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # golangci-lint-action manages its own cache

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5

      - name: Helm lint
        run: helm lint charts/orchestrator

      - name: Helm template (default values)
        run: helm template orchestrator charts/orchestrator --namespace orchestrator > /dev/null

      - name: Helm template (dev values)
        run: helm template orchestrator charts/orchestrator --namespace orchestrator --values hack/dev-values.yaml > /dev/null

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: |
          go build -o /dev/null ./cmd/jobs-service
          go build -o /dev/null ./cmd/job-sidecar

  images:
    needs: [lint, helm, test, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: ko-build/setup-ko@v0.9

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # refs/tags/v0.1.2 → tags=0.1.2,v0.1.2,latest
            VERSION="${GITHUB_REF_NAME#v}"
            echo "tags=${VERSION},${GITHUB_REF_NAME},latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${GITHUB_SHA},latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push jobs-service
        env:
          KO_DOCKER_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jobs-service
        run: |
          ko build ./cmd/jobs-service \
            --bare \
            --tags=${{ steps.tags.outputs.tags }} \
            --platform=linux/amd64,linux/arm64

      - name: Build and push job-sidecar
        env:
          KO_DOCKER_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/job-sidecar
        run: |
          ko build ./cmd/job-sidecar \
            --bare \
            --tags=${{ steps.tags.outputs.tags }} \
            --platform=linux/amd64,linux/arm64

  chart:
    needs: [lint, helm, test, build]
    # Only publish charts on tag pushes — avoids OCI registry churn on every main commit.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Package and push chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package charts/orchestrator \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination /tmp
          helm push "/tmp/orchestrator-${VERSION}.tgz" oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

  integration:
    needs: [lint, helm, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: ko-build/setup-ko@v0.9

      - name: Build sidecar image
        run: KO_DOCKER_REPO=ko.local/job-sidecar ko build --local --bare ./cmd/job-sidecar

      - name: Pull test images
        run: docker pull alpine:latest

      - name: Run integration tests
        run: go test -race -tags=integration -timeout=10m ./...

  e2e:
    needs: [lint, helm, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: ko-build/setup-ko@v0.9

      - name: Build images
        run: |
          KO_DOCKER_REPO=ko.local/jobs-service ko build --local --bare ./cmd/jobs-service
          KO_DOCKER_REPO=ko.local/job-sidecar ko build --local --bare ./cmd/job-sidecar

      - name: Pull test images
        run: docker pull alpine:latest

      - name: Run e2e tests
        run: go test -race -tags=e2e -timeout=10m ./...
