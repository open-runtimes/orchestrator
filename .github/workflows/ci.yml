name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # golangci-lint-action manages its own cache

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5

      - name: Helm lint
        run: helm lint charts/orchestrator

      - name: Helm template (default values)
        run: helm template orchestrator charts/orchestrator --namespace orchestrator > /dev/null

      - name: Helm template (dev values)
        run: helm template orchestrator charts/orchestrator --namespace orchestrator --values hack/dev-values.yaml > /dev/null

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: |
          go build -o /dev/null ./cmd/jobs-service
          go build -o /dev/null ./cmd/job-sidecar
          go build -o /dev/null ./cmd/deployments-service
          go build -o /dev/null ./cmd/workload-sidecar
          go build -o /dev/null ./cmd/deployments-activator
          go build -o /dev/null ./cmd/pool-shim

  images:
    needs: [lint, helm, test, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: ko-build/setup-ko@v0.9

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # refs/tags/v0.1.2 → tags=0.1.2,v0.1.2,latest
            VERSION="${GITHUB_REF_NAME#v}"
            echo "tags=${VERSION},${GITHUB_REF_NAME},latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${GITHUB_SHA},latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push jobs-service
        env:
          KO_DOCKER_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jobs-service
        run: |
          ko build ./cmd/jobs-service \
            --bare \
            --tags=${{ steps.tags.outputs.tags }} \
            --platform=linux/amd64,linux/arm64

      - name: Build and push job-sidecar
        env:
          KO_DOCKER_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/job-sidecar
        run: |
          ko build ./cmd/job-sidecar \
            --bare \
            --tags=${{ steps.tags.outputs.tags }} \
            --platform=linux/amd64,linux/arm64

      - name: Build and push deployments-service
        env:
          KO_DOCKER_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/deployments-service
        run: |
          ko build ./cmd/deployments-service \
            --bare \
            --tags=${{ steps.tags.outputs.tags }} \
            --platform=linux/amd64,linux/arm64

      - name: Build and push workload-sidecar
        env:
          KO_DOCKER_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/workload-sidecar
        run: |
          ko build ./cmd/workload-sidecar \
            --bare \
            --tags=${{ steps.tags.outputs.tags }} \
            --platform=linux/amd64,linux/arm64

      - name: Build and push deployments-activator
        env:
          KO_DOCKER_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/deployments-activator
        run: |
          ko build ./cmd/deployments-activator \
            --bare \
            --tags=${{ steps.tags.outputs.tags }} \
            --platform=linux/amd64,linux/arm64

      - name: Build and push sandbox-proxy
        env:
          KO_DOCKER_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/sandbox-proxy
        run: |
          ko build ./cmd/sandbox-proxy \
            --bare \
            --tags=${{ steps.tags.outputs.tags }} \
            --platform=linux/amd64,linux/arm64

      - name: Build and push pool-shim
        env:
          KO_DOCKER_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/pool-shim
        run: |
          ko build ./cmd/pool-shim \
            --bare \
            --tags=${{ steps.tags.outputs.tags }} \
            --platform=linux/amd64,linux/arm64

  chart:
    needs: [lint, helm, test, build]
    # Only publish charts on tag pushes — avoids OCI registry churn on every main commit.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Package and push chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package charts/orchestrator \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination /tmp
          helm push "/tmp/orchestrator-${VERSION}.tgz" oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

  integration:
    needs: [lint, helm, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: ko-build/setup-ko@v0.9

      - name: Build sidecar images
        run: |
          KO_DOCKER_REPO=ko.local/job-sidecar ko build --local --bare ./cmd/job-sidecar
          KO_DOCKER_REPO=ko.local/workload-sidecar ko build --local --bare ./cmd/workload-sidecar
          KO_DOCKER_REPO=ko.local/pool-shim ko build --local --bare ./cmd/pool-shim

      - name: Pull test images
        run: |
          docker pull alpine:latest
          docker pull traefik/whoami:latest
          docker pull ghcr.io/open-runtimes/sandbox:0.1.0

      - name: Run integration tests
        run: go test -race -tags=integration -timeout=10m ./...

  e2e:
    needs: [lint, helm, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: ko-build/setup-ko@v0.9

      - name: Build images
        run: |
          KO_DOCKER_REPO=ko.local/jobs-service ko build --local --bare ./cmd/jobs-service
          KO_DOCKER_REPO=ko.local/job-sidecar ko build --local --bare ./cmd/job-sidecar

      - name: Pull test images
        run: docker pull alpine:latest

      - name: Run e2e tests
        run: go test -race -tags=e2e -timeout=10m ./...

  k8s-integration:
    needs: [lint, helm, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: ko-build/setup-ko@v0.9

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: orchestrator-dev
          config: hack/kind-config.yaml

      - name: Build and load images into kind
        run: |
          KO_DOCKER_REPO=ko.local/jobs-service ko build --local --bare ./cmd/jobs-service
          KO_DOCKER_REPO=ko.local/job-sidecar ko build --local --bare ./cmd/job-sidecar
          KO_DOCKER_REPO=ko.local/workload-sidecar ko build --local --bare ./cmd/workload-sidecar
          KO_DOCKER_REPO=ko.local/deployments-activator ko build --local --bare ./cmd/deployments-activator
          KO_DOCKER_REPO=ko.local/pool-shim ko build --local --bare ./cmd/pool-shim
          kind load docker-image ko.local/jobs-service:latest ko.local/job-sidecar:latest ko.local/workload-sidecar:latest ko.local/deployments-activator:latest ko.local/pool-shim:latest --name orchestrator-dev

      - name: Install Gateway API + Traefik
        run: KUBE_CONTEXT=kind-orchestrator-dev bash hack/install-gateway.sh

      - name: Preload worker images
        # Speeds up tests by avoiding kubelet pulling from upstream during each run.
        run: |
          docker pull alpine:3.20
          docker pull registry.k8s.io/e2e-test-images/agnhost:2.47
          kind load docker-image alpine:3.20 registry.k8s.io/e2e-test-images/agnhost:2.47 --name orchestrator-dev

      - name: Run K8s integration tests
        run: go test -race -tags=k8s_integration -timeout=10m ./internal/orchestrator/kubernetes/... ./internal/deployment/kubernetes/...
