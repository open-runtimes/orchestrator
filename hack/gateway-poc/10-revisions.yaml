# Three fake "revisions": rev-a, rev-b (weighted split), rev-async (async path).
# traefik/whoami echoes the received request headers in its response body,
# which is how we verify the per-backendRef X-Revision header injection.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rev-a
  namespace: gwtest
spec:
  replicas: 1
  selector:
    matchLabels: {app: rev-a}
  template:
    metadata:
      labels: {app: rev-a}
    spec:
      containers:
        - name: whoami
          image: traefik/whoami
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: rev-a
  namespace: gwtest
spec:
  selector: {app: rev-a}
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rev-b
  namespace: gwtest
spec:
  replicas: 1
