# Two rules, deliberately with the DEFAULT rule FIRST:
# Gateway API precedence must sort the header-match rule (Prefer: respond-async)
# ahead of the match-less default rule regardless of listed order.
#
# The X-Revision filters are PER-BACKENDREF (inside backendRefs[]), which is
# Gateway API Extended support — the load-bearing assumption for the design's
# "Revision identity" bullet. `set` (not `add`) so client-supplied X-Revision
# is always overwritten at the edge.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo
  namespace: gwtest
spec:
  parentRefs:
    - name: demo
  hostnames:
    - demo.test
  rules:
    # Rule 1 (default): 90/10 weighted split, revision identity per backendRef.
    - backendRefs:
        - name: rev-a
          port: 80
          weight: 90
          filters:
            - type: RequestHeaderModifier
              requestHeaderModifier:
                set:
                  - name: X-Revision
                    value: rev-a
        - name: rev-b
          port: 80
          weight: 10
          filters:
            - type: RequestHeaderModifier
              requestHeaderModifier:
                set:
                  - name: X-Revision
                    value: rev-b
    # Rule 2 (async): exact header match on the literal "respond-async".
    - matches:
        - headers:
            - type: Exact
              name: Prefer
              value: respond-async
      backendRefs:
        - name: rev-async
          port: 80
          weight: 100
          filters:
            - type: RequestHeaderModifier
              requestHeaderModifier:
                set:
                  - name: X-Revision
                    value: rev-async
