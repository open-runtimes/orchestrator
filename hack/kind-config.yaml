# Kind cluster config for local orchestrator development.
# K8s 1.29+ is required for native sidecar containers (restartPolicy: Always on init).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: orchestrator-dev
nodes:
  - role: control-plane
    # K8s 1.37, matching client-go; needs kind v0.33+. Native sidecars need 1.29+, and the Gateway API CRDs
    # use CEL functions (isIP) that need 1.31+.
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      # Map kind node port 30080 → localhost 8080 so curl can reach jobs-service
      # via a NodePort (see deploy/kubernetes/service-nodeport.yaml below if wanted),
      # or use `task k8s:port-forward` instead (preferred).
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
