# Helm value overrides for local development (applied on top of charts/orchestrator/values.yaml).
# Used by the Tiltfile when running against the kind-orchestrator-dev cluster.
jobs:
  image:
    repository: ko.local/jobs-service
    tag: latest
    pullPolicy: Never
  sidecarImage:
    repository: ko.local/job-sidecar
    tag: latest

orchestrator:
  # Kind loaded the ko.local/job-sidecar image; tell kubelet to use it instead of pulling.
  # Worker pull policy stays empty so user images (alpine, python, etc.) still pull normally.
  sidecarImagePullPolicy: Never

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 32Mi
