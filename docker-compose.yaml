# Run the orchestrator against the local Docker daemon — the fastest way to
# try the API without a Kubernetes cluster. See docs/jobs.md and
# docs/deployments.md for what to do once it's up.
#
#   docker compose up -d
#   curl -X POST localhost:8080/v1/jobs -H 'Content-Type: application/json' \
#     -d '{"id": "hello", "image": "alpine:latest", "command": "echo hi"}'
#   curl -X POST localhost:8082/v1/deployments -H 'Content-Type: application/json' \
#     -d '{"id": "web", "image": "traefik/whoami", "port": 80}'
#   curl -H 'Host: web.localhost' localhost:8081/
#
# Both services drive the host's Docker daemon through the mounted socket;
# the workload containers they create join this compose file's network so
# services and sidecars can reach each other by IP and DNS name.
#
# The Docker backend is the development profile: single-revision deployments,
# one replica each, exec-only pools. Production runs the Helm chart — see
# docs/operations.md and examples/helm-values.yaml.

services:
  jobs:
    image: ${JOBS_IMAGE:-ghcr.io/open-runtimes/orchestrator/jobs-service:latest}
    # The images run as uid 65532; root is needed to open the host's Docker
    # socket. Fine for this dev profile — production is the Helm chart, where
    # nothing mounts a container runtime socket.
    user: "0"
    ports:
      - "8080:8080" # jobs API
      - "9090:9090" # Prometheus metrics
    environment:
      ORCHESTRATOR_BACKEND: docker
      # Workload + sidecar containers join this network.
      ORCHESTRATOR_NETWORK: orchestrator
      # Sidecars report artifact results back to the service by its DNS name.
      ARTIFACT_ENDPOINT: http://jobs:8080
      JOB_SIDECAR_IMAGE: ${JOB_SIDECAR_IMAGE:-ghcr.io/open-runtimes/orchestrator/job-sidecar:latest}
      # API_KEY_FILE: /run/secrets/api-key   # uncomment to require Bearer auth
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [orchestrator]

  deployments:
    image: ${DEPLOYMENTS_IMAGE:-ghcr.io/open-runtimes/orchestrator/deployments-service:latest}
    user: "0" # see jobs
    ports:
      - "8082:8080" # deployments + pools API (8080 in-container; 8082 on the host — jobs owns 8080)
      - "8081:8081" # data plane: HTTP to your deployments, routed by Host header
    environment:
      ORCHESTRATOR_BACKEND: docker
      DOCKER_NETWORK: orchestrator
      # Deployments get hosts like web.localhost, served on the data port.
      DEPLOYMENTS_DOMAIN: localhost
      DEPLOYMENT_SIDECAR_IMAGE: ${DEPLOYMENT_SIDECAR_IMAGE:-ghcr.io/open-runtimes/orchestrator/deployments-sidecar:latest}
      ARTIFACT_ENDPOINT: http://deployments:8080
      # Warm pools (exec-only on Docker) — see docs/pools.md:
      # POOLS_JSON: '[{"id": "sh", "image": "alpine:latest", "size": 2, "burst": "reject"}]'
      # POOL_SHIM_IMAGE: ghcr.io/open-runtimes/orchestrator/pool-shim:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [orchestrator]

networks:
  orchestrator:
    # Fixed name: the services pass it to the daemon when creating workload
    # containers, so it must match the real network name, not the
    # compose-project-prefixed default.
    name: orchestrator
