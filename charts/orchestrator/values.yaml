# Default values for the orchestrator chart.
# The chart does NOT create a namespace — install with `helm install -n <ns> --create-namespace`
# or apply a Namespace manifest separately.

# The chart ships one API today (jobs). Future APIs (deployments, statefulsets, ...)
# will be added as additional Deployments + Services in the same chart, each
# with its own component name. Resource naming for the jobs API lives under
# `jobs.fullnameOverride` so it doesn't collide with the release's fullname.
jobs:
  # Empty uses "jobs" when the release is named "orchestrator", otherwise
  # "<release>-jobs" to keep resources scoped to the release.
  fullnameOverride: ""
  # Image for the jobs-service Deployment.
  # CI publishes ghcr.io/open-runtimes/orchestrator/jobs-service on every main push,
  # tagged with both :latest and the commit SHA (plus the semver on release tags).
  image:
    # ref fully overrides repository+tag when set (useful for digests, e.g. ko.local/... in dev).
    ref: ""
    repository: ghcr.io/open-runtimes/orchestrator/jobs-service
    tag: "" # defaults to the chart's appVersion
    pullPolicy: IfNotPresent
  # Image used by job pods (worker workspace init + native sidecar), and by
  # deployment pods' artifact-pre init container. Passed via JOB_SIDECAR_IMAGE.
  sidecarImage:
    ref: ""
    repository: ghcr.io/open-runtimes/orchestrator/job-sidecar
    tag: "" # defaults to the chart's appVersion
  # Credentials for s3:// download/upload artifacts, scoped to the jobs service.
  # When enabled, the jobs-service forwards these into every job sidecar.
  s3:
    enabled: false
    endpoint: ""          # empty = AWS (region-derived host); set for MinIO/custom
    region: us-east-1
    forcePathStyle: false  # true for MinIO/path-style endpoints
    accessKeyId: ""
    secretAccessKey: ""
    # Reference an existing Secret with keys S3_ACCESS_KEY_ID and
    # S3_SECRET_ACCESS_KEY instead of the inline values above.
    existingSecret: ""
  # Bearer-token auth for the jobs API (internal/api.AuthMiddleware). The key
  # also derives the per-job tokens sidecars use to post artifact results to
  # the internal endpoint. Empty existingSecret leaves both unauthenticated.
  # The referenced Secret must exist in the release namespace; its value is
  # mounted read-only and passed via API_KEY_FILE.
  auth:
    existingSecret: ""
    secretKey: api-key
  # Optional Gateway API `Gateway` + `HTTPRoute` exposing the jobs API
  # publicly. Unrelated to `deployments.gateway` below, which instead points
  # the deployments-service's own in-process reconciler at an
  # already-existing Gateway — the jobs API has no such reconciler, so the
  # chart renders both resources directly, matching the shape of a
  # hand-rolled Gateway/HTTPRoute pair.
  gateway:
    # Render a Gateway API `Gateway` resource that the HTTPRoute below
    # attaches to. Leave disabled when the Gateway is managed elsewhere and
    # `httpRoute.parentRefs` points at that external Gateway by name.
    enabled: false
    # `gatewayClassName` the controller selects on. Required when enabled.
    gatewayClassName: ""
    # Listener entries passed verbatim into `spec.listeners`. Required when
    # enabled. Example:
    #   listeners:
    #     - name: web
    #       port: 8000
    #       protocol: HTTP
    #       allowedRoutes:
    #         namespaces:
    #           from: Same
    listeners: []
  # Divisors deriving a job's requests from its declared cpu/memory limits:
  # request = limit / overcommit (docs/operations.md "Resource model").
  # Independent from deployments.{cpu,memory}Overcommit. Values <= 0 mean 1.
  cpuOvercommit: 1
  memoryOvercommit: 1
  # Tolerations stamped on every job pod (standard pod-spec schema), for
  # tainted node pools, e.g.:
  #   workloadTolerations:
  #     - key: workload
  #       value: edge-builds
  #       effect: NoSchedule
  workloadTolerations: []
  # Node selector stamped on every job pod, pinning jobs to a dedicated node
  # pool (standard pod-spec schema). Pair with workloadTolerations when the
  # pool is tainted, e.g.:
  #   workloadNodeSelector:
  #     workload: edge-builds
  workloadNodeSelector: {}
  httpRoute:
    # Render a Gateway API `HTTPRoute` for the jobs API. Use this instead of
    # an Ingress when running on a Gateway API-compatible controller/mesh.
    enabled: false
    # Gateway parents this route should attach to. Each entry follows the
    # Gateway API `parentRefs` schema (`{ name, namespace?, sectionName? }`).
    # Defaults to the Gateway above when it's enabled and this is empty.
    parentRefs: []
    # Hostnames the route matches against.
    hostnames: []

# Serving-plane API (deployments + deployment-pools). Disabled by default —
deployments:
  enabled: false
  # Empty uses "deployments" when the release is named "orchestrator",
  # otherwise "<release>-deployments".
  fullnameOverride: ""
  replicaCount: 1
  image:
    ref: ""
    repository: ghcr.io/open-runtimes/orchestrator/deployments-service
    tag: "" # defaults to the chart's appVersion
    pullPolicy: IfNotPresent
  # Image for the deployments-sidecar (reverse proxy) in every workload pod.
  sidecarImage:
    ref: ""
    repository: ghcr.io/open-runtimes/orchestrator/deployments-sidecar
    tag: "" # defaults to the chart's appVersion
  # Credentials for s3:// download artifacts, scoped to the deployments/pools
  # service. Forwarded into the artifact-pre init container and warm-pool pods.
  s3:
    enabled: false
    endpoint: ""
    region: us-east-1
    forcePathStyle: false
    accessKeyId: ""
    secretAccessKey: ""
    existingSecret: ""
  # Data-plane port the in-process activator listens on (Host-based routing).
  dataPort: 8081
  # Base domain for auto-assigned hosts: {id}.{domain}.
  domain: localhost
  # Annotations on the deployments-service pod (the chart-level podAnnotations
  # applies only to the jobs component).
  podAnnotations: {}
  # Hardened workload namespace: run workloads (revisions, warm pools) in a
  # dedicated namespace instead of the release namespace, with Pod Security
  # Admission and network isolation applied. The Gateway must allow routes
  # from this namespace (allowedRoutes.namespaces != Same).
  workloadNamespace:
    enabled: false
    # Empty = "<release namespace>-workloads".
    name: ""
    # Create the namespace (with the labels below). Disable if it is
    # provisioned externally.
    create: true
    # Pod Security Admission enforce level label ("" = no PSA labels). The
    # generated pods run under the hardened floor and admit cleanly at
    # "restricted".
    podSecurity: restricted
    # Default-deny ingress to workload pods except from the gateway,
    # activator, and deployments-service; egress blocks the cloud metadata
    # endpoint. Requires an enforcing CNI — kind's default kindnet does NOT
    # enforce NetworkPolicy.
    networkPolicy:
      enabled: true
      # Namespace the gateway controller pods run in (ingress allow rule).
      gatewayNamespace: traefik-system
    # Per-namespace ceiling on workload consumption.
    resourceQuota:
      enabled: false
      pods: 200
      requestsCpu: "100"
      requestsMemory: 200Gi
  # Gateway API integration: the deployments-service reconciles an HTTPRoute
  # per deployment against this Gateway (Traefik / Envoy Gateway / Istio with
  # Extended backendRef-filter support).
  gateway:
    enabled: true
    name: orchestrator
    # Empty = release namespace.
    namespace: ""
  # Bearer-token auth for the deployments API, same mechanism as jobs.auth.
  auth:
    existingSecret: ""
    secretKey: api-key
  # Divisors deriving a workload's requests from its declared limits:
  # request = limit / overcommit (docs/operations.md "Resource model"). CPU is
  # compressible, so raising cpuOvercommit packs workloads denser; memory is
  # not — raising memoryOvercommit trades OOM risk for density. Applies to
  # deployment replicas and warm-pool pods. Values <= 0 mean 1.
  cpuOvercommit: 1
  memoryOvercommit: 1
  # Tolerations stamped on every workload pod — deployment replicas and
  # warm-pool pods (standard pod-spec schema), for tainted node pools.
  # Independent from jobs.workloadTolerations.
  workloadTolerations: []
  # Node selector stamped on every workload pod — deployment replicas and
  # warm-pool pods — pinning them to a dedicated node pool. Pair with
  # workloadTolerations when the pool is tainted. Independent from
  # jobs.workloadNodeSelector.
  workloadNodeSelector: {}
  # Leader election gates the background reconcilers (rollout auto-cut, cold
  # endpoint flip, autoscaler) to one replica. Required when replicaCount > 1.
  leaderElection:
    enabled: false
    # Empty = "<deployments name>-leader".
    leaseName: ""
    leaseDurationSeconds: 15
    renewDeadlineSeconds: 10
    retryPeriodSeconds: 2
  # Optional LimitRange in the release namespace: default requests for
  # containers that declare none (no BestEffort creep) and a default memory
  # limit. Deliberately no default cpu limit — see resource-model.md.
  limitRange:
    enabled: false
  # Warm pools (docs/pools.md): config-declared fleets an activation
  # late-binds onto. Each entry is a pkg/pool.Pool: {id, image, size, cpu,
  # memory, port (required), burst (cold|reject; default cold), environment,
  # volumes: [{source (PVC name), path, subPath, readonly}] mounted into every pod}.
  # Adding/resizing/removing a pool is a values change + rollout, not an API call.
  pools: []
  # Image for the pool-shim (warm-pod entrypoint; installed into workload
  # containers by the shim-install init container).
  shimImage:
    ref: ""
    repository: ghcr.io/open-runtimes/orchestrator/pool-shim
    tag: "" # defaults to the chart's appVersion
  # The buffering edge for cold/async traffic (deployments-activator).
  activator:
    # The buffering edge for cold-start and async traffic. Opt-in like every
    # component; without it, scale-to-zero deployments 503 when cold and
    # async requests have nowhere to buffer.
    enabled: false
    replicaCount: 1
    # HPA for the buffering edge (stateless; no leader election needed).
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80
    image:
      ref: ""
      repository: ghcr.io/open-runtimes/orchestrator/deployments-activator
      tag: "" # defaults to the chart's appVersion
      pullPolicy: IfNotPresent
    port: 8081
    # No CPU limit by design (same rule as workloads — CFS throttling hurts
    # a latency-critical proxy most of all); memory request = limit.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  # HPA for the deployments service. Requires deployments.leaderElection.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  # No CPU limit by design — see the activator note.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

replicaCount: 1

# HPA for the jobs service. Requires leaderElection.enabled.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Leader election coordinates watcher ownership across replicas. Required when
# replicaCount > 1 to avoid duplicate lifecycle callbacks; optional at
# replicaCount == 1 (and cheap — the lone candidate just always wins).
leaderElection:
  enabled: false
  # Empty = Helm release-derived "<fullname>-leader". Override only if you run
  # multiple releases in the same namespace.
  leaseName: ""
  leaseDurationSeconds: 15
  renewDeadlineSeconds: 10
  retryPeriodSeconds: 2

serviceAccount:
  # ServiceAccount for the jobs-service Deployment itself — needs RBAC to manage Jobs+Pods.
  create: true
  name: ""
  # ServiceAccount used by every job pod. Intentionally has no RoleBindings; the sidecar
  # does not call the K8s API (it catches SIGTERM from kubelet).
  jobSidecarCreate: true
  # Empty defaults to "<release>-job-sidecar" so releases sharing a namespace don't collide.
  jobSidecarName: ""

rbac:
  create: true

service:
  type: ClusterIP
  apiPort: 8080
  metricsPort: 9090

# Orchestrator runtime config.
orchestrator:
  # Namespace where temporary Kubernetes Jobs and their Pods are created.
  # Empty keeps them in the Helm release namespace.
  jobNamespace: ""
  # Create orchestrator.jobNamespace when it is set to a namespace different
  # from the Helm release namespace.
  jobNamespaceCreate: false
  # Full URL the sidecar POSTs artifact reports to. Empty auto-derives from release+namespace.
  artifactEndpoint: ""
  jobRetention: 15m
  maintenanceInterval: 1m
  # Max time buffered job log lines wait before a callback flush (they also
  # flush at 32 lines) — keeps low-volume build logs streaming in near real time.
  logFlushInterval: 1s
  # How long kubelet waits for the post-sidecar to finish after sending SIGTERM.
  terminationGracePeriodSeconds: 600
  # ImagePullPolicy applied to containers inside job pods. Empty = kubelet default.
  # workerImagePullPolicy applies to the user workload; sidecarImagePullPolicy applies to
  # artifact-pre + artifact-post (our own image). For local dev with ko-loaded images,
  # set sidecarImagePullPolicy=Never and leave workerImagePullPolicy empty so alpine etc.
  # still pulls from upstream.
  workerImagePullPolicy: ""
  sidecarImagePullPolicy: ""

# No CPU limit by design (same rule as workloads — CPU is compressible and
# limits cause needless throttling); memory is capped.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podAnnotations: {}

# Arbitrary extra env vars on the jobs-service container.
# Each entry is a raw corev1.EnvVar (supports .value, .valueFrom, etc.).
extraEnv: []
