# Default values for the orchestrator chart.
# The chart does NOT create a namespace — install with `helm install -n <ns> --create-namespace`
# or apply a Namespace manifest separately.

# The chart ships one API today (jobs). Future APIs (deployments, statefulsets, ...)
# will be added as additional Deployments + Services in the same chart, each
# with its own component name. Resource naming for the jobs API lives under
# `jobs.fullnameOverride` so it doesn't collide with the release's fullname.
jobs:
  # Empty uses "jobs" when the release is named "orchestrator", otherwise
  # "<release>-jobs" to keep resources scoped to the release.
  fullnameOverride: ""
  # Image for the jobs-service Deployment.
  # CI publishes ghcr.io/open-runtimes/orchestrator/jobs-service on every main push,
  # tagged with both :latest and the commit SHA (plus the semver on release tags).
  image:
    # ref fully overrides repository+tag when set (useful for digests, e.g. ko.local/... in dev).
    ref: ""
    repository: ghcr.io/open-runtimes/orchestrator/jobs-service
    tag: latest
    pullPolicy: IfNotPresent
  # Image used by job pods (worker workspace init + native sidecar), and by
  # deployment pods' artifact-pre init container. Passed via JOB_SIDECAR_IMAGE.
  sidecarImage:
    ref: ""
    repository: ghcr.io/open-runtimes/orchestrator/job-sidecar
    tag: latest

# Serving-plane API (deployments + deployment-pools). Disabled by default —
# Phase 0 ships a probe-only skeleton; see docs/design/implementation-plan.md.
deployments:
  enabled: false
  # Empty uses "deployments" when the release is named "orchestrator",
  # otherwise "<release>-deployments".
  fullnameOverride: ""
  replicaCount: 1
  image:
    ref: ""
    repository: ghcr.io/open-runtimes/orchestrator/deployments-service
    tag: latest
    pullPolicy: IfNotPresent
  # Image for the deployments-sidecar (reverse proxy) in every workload pod.
  sidecarImage:
    ref: ""
    repository: ghcr.io/open-runtimes/orchestrator/deployments-sidecar
    tag: latest
  # Data-plane port the in-process activator listens on (Host-based routing).
  dataPort: 8081
  # Base domain for auto-assigned hosts: {id}.{domain}.
  domain: localhost
  # Gateway API integration: the deployments-service reconciles an HTTPRoute
  # per deployment against this Gateway (Traefik / Envoy Gateway / Istio with
  # Extended backendRef-filter support).
  gateway:
    enabled: true
    name: orchestrator
    # Empty = release namespace.
    namespace: ""
  # The buffering edge for cold/async traffic (deployments-activator).
  activator:
    replicaCount: 1
    image:
      ref: ""
      repository: ghcr.io/open-runtimes/orchestrator/deployments-activator
      tag: latest
      pullPolicy: IfNotPresent
    port: 8081
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

replicaCount: 1

# Leader election coordinates watcher ownership across replicas. Required when
# replicaCount > 1 to avoid duplicate lifecycle callbacks; optional at
# replicaCount == 1 (and cheap — the lone candidate just always wins).
leaderElection:
  enabled: false
  # Empty = Helm release-derived "<fullname>-leader". Override only if you run
  # multiple releases in the same namespace.
  leaseName: ""
  leaseDurationSeconds: 15
  renewDeadlineSeconds: 10
  retryPeriodSeconds: 2

serviceAccount:
  # ServiceAccount for the jobs-service Deployment itself — needs RBAC to manage Jobs+Pods.
  create: true
  name: ""
  # ServiceAccount used by every job pod. Intentionally has no RoleBindings; the sidecar
  # does not call the K8s API (it catches SIGTERM from kubelet).
  jobSidecarCreate: true
  jobSidecarName: job-sidecar

rbac:
  create: true

service:
  type: ClusterIP
  apiPort: 8080
  metricsPort: 9090

# Orchestrator runtime config.
orchestrator:
  # Namespace where temporary Kubernetes Jobs and their Pods are created.
  # Empty keeps them in the Helm release namespace.
  jobNamespace: ""
  # Create orchestrator.jobNamespace when it is set to a namespace different
  # from the Helm release namespace.
  jobNamespaceCreate: false
  # Full URL the sidecar POSTs artifact reports to. Empty auto-derives from release+namespace.
  artifactEndpoint: ""
  jobRetention: 15m
  maintenanceInterval: 1m
  # How long kubelet waits for the post-sidecar to finish after sending SIGTERM.
  terminationGracePeriodSeconds: 600
  # ImagePullPolicy applied to containers inside job pods. Empty = kubelet default.
  # workerImagePullPolicy applies to the user workload; sidecarImagePullPolicy applies to
  # artifact-pre + artifact-post (our own image). For local dev with ko-loaded images,
  # set sidecarImagePullPolicy=Never and leave workerImagePullPolicy empty so alpine etc.
  # still pulls from upstream.
  workerImagePullPolicy: ""
  sidecarImagePullPolicy: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podAnnotations: {}

# Arbitrary extra env vars on the jobs-service container.
# Each entry is a raw corev1.EnvVar (supports .value, .valueFrom, etc.).
extraEnv: []
