# Default values for the orchestrator chart.
#
# Every plane (jobs, deployments, sandbox) and every component (the activator,
# the sandbox proxy, the pool controller, the mount agent) takes the same
# keys: image, replicaCount, autoscaling, leaderElection, resources,
# podAnnotations, nodeSelector, tolerations, affinity, priorityClassName,
# serviceAccount and service. A plane adds what its workload pods get
# (namespace, networkPolicy, workload, httpRoute, auth, s3).
#
# The chart creates no namespaces: install with `helm install -n <ns>
# --create-namespace`, and provision each plane's namespace yourself
# (docs/operations.md "A namespace per plane").

# Override the app name in the recommended labels, and the prefix every
# resource name is built from: "<release>" when the release name contains the
# chart name, otherwise "<release>-orchestrator". Components append their own
# name ("<fullname>-jobs", "<fullname>-pool-controller-revision", ...).
nameOverride: ""
fullnameOverride: ""

# Pull credentials for every pod this chart renders, which all live in the
# release namespace. Workload pods are created by the services, so their
# credentials go on the ServiceAccount they run as (jobs.workload.serviceAccount
# for job pods; docs/operations.md).
imagePullSecrets: []

# Arbitrary extra env vars on every control-plane container. Each entry is a
# raw corev1.EnvVar (supports .value, .valueFrom, etc.).
extraEnv: []

rbac:
  # Roles, RoleBindings, ClusterRoles and their bindings for every component.
  create: true

# Shutdown budget of every control-plane pod: HTTP shutdown (25s), component
# cleanup (10s) and the final OTLP flush (10s), with margin.
terminationGracePeriodSeconds: 60

# The Gateway API Gateway every plane's HTTPRoutes attach to: the jobs API
# route, the deployments service's per-deployment routes, and the sandbox
# wildcard route.
gateway:
  # Render the Gateway. Leave off to attach to one managed elsewhere.
  create: false
  # Required with create.
  className: ""
  # spec.listeners, verbatim. Required with create. When planes run in their
  # own namespaces, allowedRoutes.namespaces must admit them.
  listeners: []
  # Empty = the chart's fullname.
  name: ""
  # Empty = the release namespace.
  namespace: ""

# Images the services place in workload pods, beside the user's container.
images:
  # Job pods' sidecar, and the artifact-pre init container of deployment pods.
  jobSidecar:
    ref: ""
    repository: ghcr.io/open-runtimes/orchestrator/job-sidecar
    tag: "" # defaults to the chart's appVersion
  # The reverse proxy in front of every deployment replica and sandbox.
  workloadSidecar:
    ref: ""
    repository: ghcr.io/open-runtimes/orchestrator/workload-sidecar
    tag: ""
  # The warm-pod entrypoint, for deployment and sandbox pools.
  poolShim:
    ref: ""
    repository: ghcr.io/open-runtimes/orchestrator/pool-shim
    tag: ""
  # The agent serving the sandbox contract, copied into every sandbox's
  # workspace. The tag is the agent version pin and matches the in-code
  # default (internal/sandbox.AgentImage): bump both together.
  sandboxAgent:
    ref: ""
    repository: ghcr.io/open-runtimes/sandbox
    tag: "0.1.0"
  # The node mount agent's CSI registration sidecar.
  csiRegistrar:
    ref: ""
    repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
    tag: v2.13.0
  # Pull policy for the images above in workload pods. Empty = kubelet default.
  pullPolicy: ""

# Pull policy for the user's own image in workload pods. Empty = kubelet
# default. For local dev with ko-loaded images, set images.pullPolicy=Never and
# leave this empty so upstream images still pull.
workloadImagePullPolicy: ""

# Jobs API: run-to-completion workloads (batch/v1 Job + a native sidecar each).
jobs:
  # Opt-in like every component: a bare `helm install` renders nothing.
  enabled: false
  # Namespace job pods run in; "" = the release namespace. Provision it with
  # its Pod Security labels (baseline, or privileged for in-pod mounting
  # without the mount agent).
  namespace: ""
  # Job pods: no ingress, egress anywhere but the cloud metadata endpoint. Off
  # by default, since what a build may reach is a platform decision.
  networkPolicy:
    enabled: false
  image:
    ref: ""
    repository: ghcr.io/open-runtimes/orchestrator/jobs-service
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  # Requires leaderElection.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  # Coordinates watcher ownership; required above one replica.
  leaderElection:
    enabled: false
    # Empty = "<jobs name>-leader".
    leaseName: ""
    leaseDurationSeconds: 15
    renewDeadlineSeconds: 10
    retryPeriodSeconds: 2
  # No CPU limit by design: CPU is compressible and limits only throttle.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  serviceAccount:
    create: true
    # Empty = the component name.
    name: ""
  service:
    type: ClusterIP
    port: 8080
  # Bearer-token auth for the API: name a Secret in the release namespace.
  # Empty leaves the API open. The key also derives the tokens job sidecars
  # post artifact results with.
  auth:
    existingSecret: ""
    secretKey: api-key
  # Credentials for s3:// artifacts, forwarded into every job sidecar.
  s3:
    enabled: false
    endpoint: ""          # empty = AWS (region-derived host)
    region: us-east-1
    forcePathStyle: false  # true for MinIO/path-style endpoints
    accessKeyId: ""
    secretAccessKey: ""
    # A Secret with keys S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY (plus
    # S3_<NAME>_ACCESS_KEY_ID and S3_<NAME>_SECRET_ACCESS_KEY per profile)
    # instead of the inline keys.
    existingSecret: ""
    # Named credential profiles for another store (account, endpoint or
    # provider), with the same fields as above. An artifact selects one as
    # s3://<name>@bucket/key; a plain s3://bucket/key uses the default.
    profiles: {}
    #   archive:
    #     endpoint: http://minio:9000
    #     region: us-east-1
    #     forcePathStyle: true
    #     accessKeyId: ""
    #     secretAccessKey: ""
  # An HTTPRoute for the jobs API on the gateway above.
  httpRoute:
    enabled: false
    hostnames: []
  # The pods the service creates.
  workload:
    # Pin job pods to a node pool, and tolerate its taints.
    nodeSelector: {}
    tolerations: []
    # request = limit / overcommit (docs/operations.md "Resource model").
    cpuOvercommit: 1
    memoryOvercommit: 1
    # How long the kubelet waits for the sidecar's post phase after SIGTERM.
    terminationGracePeriodSeconds: 600
    # The account job pods run as. It holds no RBAC; it is where their pull
    # credentials go.
    serviceAccount:
      create: true
      # Empty = "<fullname>-job-sidecar".
      name: ""
      # Names resolve in jobs.namespace. Empty = imagePullSecrets.
      imagePullSecrets: []
  # URL job sidecars post artifact reports to. Empty = the jobs Service.
  artifactEndpoint: ""
  # How long finished jobs are kept, and how often they are swept.
  retention: 15m
  maintenanceInterval: 1m
  # Max time buffered log lines wait before a callback flush (they also flush
  # at 32 lines).
  logFlushInterval: 1s

# Serving plane: long-lived HTTP workloads, optionally on warm Revision pools.
deployments:
  enabled: false
  # Namespace replicas and their warm pools run in; "" = the release
  # namespace. Provision it with its Pod Security labels (restricted admits
  # every pod the service creates).
  namespace: ""
  # Ingress only from the gateway, the activator and this plane's control
  # plane; egress anywhere but the cloud metadata endpoint.
  networkPolicy:
    enabled: true
    # Namespace the gateway controller pods run in.
    gatewayNamespace: traefik-system
  image:
    ref: ""
    repository: ghcr.io/open-runtimes/orchestrator/deployments-service
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  # Requires leaderElection.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  # Gates the reconcilers (rollout, endpoint flip, autoscaler) to one replica;
  # required above one replica.
  leaderElection:
    enabled: false
    leaseName: ""
    leaseDurationSeconds: 15
    renewDeadlineSeconds: 10
    retryPeriodSeconds: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  serviceAccount:
    create: true
    name: ""
  service:
    type: ClusterIP
    port: 8080
  auth:
    existingSecret: ""
    secretKey: api-key
  # Credentials for s3:// artifacts, forwarded into the artifact-pre init
  # container and warm-pool pods.
  s3:
    enabled: false
    endpoint: ""
    region: us-east-1
    forcePathStyle: false
    accessKeyId: ""
    secretAccessKey: ""
    existingSecret: ""
    profiles: {} # see jobs.s3.profiles
  # The service reconciles an HTTPRoute per deployment on the gateway above
  # (Traefik, Envoy Gateway, Istio with backendRef-filter support).
  httpRoute:
    enabled: true
  workload:
    nodeSelector: {}
    tolerations: []
    cpuOvercommit: 1
    memoryOvercommit: 1
  # Base domain for auto-assigned hosts: {id}.{domain}.
  domain: localhost
  # Concurrent Revision reconciles, and the client-side API budget for them.
  revisionWorkers: 32
  clientQPS: 200
  clientBurst: 400
  # A LimitRange in deployments.namespace: default requests for containers
  # that declare none, and a default memory limit (no cpu limit).
  limitRange:
    enabled: false
  # Warm Revision pools (docs/pools.md), matched transparently against
  # complete deployment requests: {id, image, size, cpu, memory, port,
  # burst (cold|reject), volumes: [{source, path, subPath, readonly}]}.
  # Shapes must be unique; command and environment come from the request.
  pools: []
  # Holds cold-start and async requests in front of deployments and raises
  # cold revisions from zero. Without it, scale-to-zero deployments 503 when
  # cold and async requests have nowhere to buffer.
  activator:
    enabled: false
    image:
      ref: ""
      repository: ghcr.io/open-runtimes/orchestrator/deployments-activator
      tag: ""
      pullPolicy: IfNotPresent
    replicaCount: 1
    # Stateless: no leader election needed.
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    priorityClassName: ""
    serviceAccount:
      create: true
      name: ""
    # The data port cold and async requests arrive on.
    service:
      type: ClusterIP
      port: 8081

# Sandboxes (docs/sandboxes.md): live, isolated workspaces at their own
# hostnames, served by /v1/sandbox.
sandbox:
  enabled: false
  # Namespace sandboxes and their warm pools run in; "" = the release
  # namespace. Sandboxes run untrusted code: give them one apart from
  # deployments, with Pod Security restricted.
  namespace: ""
  # Ingress only from the sandbox proxy and this plane's control plane.
  networkPolicy:
    enabled: true
  image:
    ref: ""
    repository: ghcr.io/open-runtimes/orchestrator/sandbox-service
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  # Gates claimed-sandbox lifecycle (including idle expiry) to one replica.
  leaderElection:
    enabled: false
    leaseName: ""
    leaseDurationSeconds: 15
    renewDeadlineSeconds: 10
    retryPeriodSeconds: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  serviceAccount:
    create: true
    name: ""
  service:
    type: ClusterIP
    port: 8080
  auth:
    existingSecret: ""
    secretKey: api-key
  s3:
    enabled: false
    endpoint: ""
    region: us-east-1
    forcePathStyle: false
    accessKeyId: ""
    secretAccessKey: ""
    existingSecret: ""
    profiles: {} # see jobs.s3.profiles
  # One wildcard HTTPRoute for *.{domain}, backed by the sandbox proxy. Per
  # sandbox routes are deliberately not used: gateway programming takes
  # seconds, which would negate the sub-second claim a create is built on.
  httpRoute:
    enabled: true
  workload:
    nodeSelector: {}
    tolerations: []
    cpuOvercommit: 1
    memoryOvercommit: 1
  # Wildcard domain sandboxes are addressed at: s-{token}.{domain}, and
  # s-{token}-{port}.{domain} for extra ports. Required. The hostname carries
  # a 128-bit capability token: reaching it is enough to run code there.
  domain: ""
  # Scheme handed back in sandbox URLs (https where the gateway terminates TLS).
  scheme: http
  # Operator-only warm sandbox shapes, matched transparently against complete
  # requests: {id, image, port, cpu, memory, size, runtimeClass, mounts}.
  # Untrusted code is the expected workload, so set runtimeClass: gvisor (or
  # kata). mounts lets a pool's sandboxes use the `mount` artifact; without the
  # mount agent that puts a privileged sidecar in every pod of the pool.
  pools: []
  # The data plane every sandbox request passes through.
  proxy:
    enabled: false
    image:
      ref: ""
      repository: ghcr.io/open-runtimes/orchestrator/sandbox-proxy
      tag: ""
      pullPolicy: IfNotPresent
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    priorityClassName: ""
    serviceAccount:
      create: true
      name: ""
    # The data port sandbox requests arrive on.
    service:
      type: ClusterIP
      port: 8081
    # How long a request waits for a still-creating sandbox to answer.
    holdSeconds: 5

# Warm-pod inventory: one Deployment per enabled plane with pools, each with
# its own ServiceAccount allowed only in that plane's namespace.
poolController:
  enabled: true
  image:
    ref: ""
    repository: ghcr.io/open-runtimes/orchestrator/pool-controller
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  # Required above one replica; each pool kind gets its own Lease.
  leaderElection:
    enabled: false
    # Empty = "<pool-controller name>", suffixed with the kind.
    leaseName: ""
    leaseDurationSeconds: 15
    renewDeadlineSeconds: 10
    retryPeriodSeconds: 2
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  serviceAccount:
    create: true
    # Empty = the component name; a set name is suffixed with the kind.
    name: ""

# Node mount agent (docs/design/node-mount-agent.md): a privileged DaemonSet
# on the host network that serves each mounting pod's workspace as a CSI
# inline volume and performs its mounts from the node, so no workload pod is
# privileged. Its API is gated by a per-pod token, and only pods in the
# enabled planes' namespaces may use its driver.
mountAgent:
  enabled: false
  image:
    ref: ""
    repository: ghcr.io/open-runtimes/orchestrator/mount-agent
    tag: ""
    pullPolicy: IfNotPresent
  # Port the mount API listens on, on each node's own IP.
  port: 9878
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  podAnnotations: {}
  # It must run on every node a mounting pod can land on. Empty tolerations
  # take every plane's workload.tolerations; the empty node selector runs it
  # on every node.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: system-node-critical
