{{- if and .Values.jobs.enabled .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orchestrator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.jobsLabels" . | nindent 4 }}
{{- end }}
{{- if and .Values.jobs.enabled .Values.serviceAccount.jobSidecarCreate }}
---
# ServiceAccount used by every job pod.
# Intentionally has no RoleBindings — the sidecar does not call the K8s API;
# it observes worker termination via SIGTERM from kubelet (native sidecar semantics).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orchestrator.jobSidecarServiceAccountName" . }}
  namespace: {{ include "orchestrator.jobNamespace" . }}
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
{{- with (default .Values.imagePullSecrets .Values.serviceAccount.jobSidecarImagePullSecrets) }}
# Job pods are created by the service, not the chart, so they cannot carry
# pod-level pull secrets from values — they inherit these from the account they
# run as. Same registry as jobs.preload.extraImages warms.
#
# These names resolve in THIS namespace, which is orchestrator.jobNamespace —
# not the release namespace the chart's own pods pull from. When the two
# differ, the secret has to exist in the job namespace under the name used
# here; jobSidecarImagePullSecrets overrides it when it is named differently
# there.
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
