{{- define "orchestrator.poolControllerDeployment" -}}
{{- $root := .root -}}
{{- $kind := .kind -}}
{{- $name := printf "%s-%s" (include "orchestrator.poolControllerName" $root) $kind | trunc 63 | trimSuffix "-" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "orchestrator.poolControllerLabels" $root | nindent 4 }}
    orchestrator.open-runtimes.io/pool-kind: {{ $kind }}
spec:
  replicas: {{ $root.Values.poolController.replicaCount }}
  strategy:
    {{- include "orchestrator.rolloutStrategy" $root | nindent 4 }}
  selector:
    matchLabels:
      {{- include "orchestrator.poolControllerSelectorLabels" $root | nindent 6 }}
      orchestrator.open-runtimes.io/pool-kind: {{ $kind }}
  template:
    metadata:
      labels:
        {{- include "orchestrator.poolControllerSelectorLabels" $root | nindent 8 }}
        orchestrator.open-runtimes.io/pool-kind: {{ $kind }}
    spec:
      serviceAccountName: {{ include "orchestrator.poolControllerName" $root }}
      {{- with include "orchestrator.imagePullSecrets" $root }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- include "orchestrator.podSecurityContext" $root | nindent 8 }}
      containers:
        - name: pool-controller
          image: {{ include "orchestrator.poolControllerImage" $root | quote }}
          imagePullPolicy: {{ $root.Values.poolController.image.pullPolicy }}
          securityContext:
            {{- include "orchestrator.containerSecurityContext" $root | nindent 12 }}
          ports:
            - name: metrics
              containerPort: {{ $root.Values.service.metricsPort }}
          env:
            - name: POOL_KIND
              value: {{ $kind | quote }}
            - name: METRICS_PORT
              value: {{ $root.Values.service.metricsPort | quote }}
            - name: KUBE_NAMESPACE
              value: {{ include "orchestrator.workloadNamespace" $root | quote }}
            - name: WORKLOAD_SIDECAR_IMAGE
              value: {{ include "orchestrator.workloadSidecarImage" $root | quote }}
            - name: POOL_SHIM_IMAGE
              value: {{ include "orchestrator.poolShimImage" $root | quote }}
            {{- if eq $kind "revision" }}
            - name: POOLS_JSON
              value: {{ $root.Values.deployments.pools | toJson | quote }}
            - name: KUBE_CPU_OVERCOMMIT
              value: {{ $root.Values.deployments.cpuOvercommit | quote }}
            - name: KUBE_MEMORY_OVERCOMMIT
              value: {{ $root.Values.deployments.memoryOvercommit | quote }}
            {{- with $root.Values.deployments.workloadTolerations }}
            - name: KUBE_WORKLOAD_TOLERATIONS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with $root.Values.deployments.workloadNodeSelector }}
            - name: KUBE_WORKLOAD_NODE_SELECTOR
              value: {{ toJson . | quote }}
            {{- end }}
            {{- include "orchestrator.s3Env" (dict "s3" $root.Values.deployments.s3 "secretName" (include "orchestrator.deploymentsS3SecretName" $root)) | nindent 12 }}
            {{- else }}
            - name: SANDBOX_POOLS_JSON
              value: {{ $root.Values.sandbox.pools | toJson | quote }}
            - name: SANDBOX_AGENT_IMAGE
              value: {{ include "orchestrator.sandboxAgentImage" $root | quote }}
            - name: KUBE_CPU_OVERCOMMIT
              value: {{ $root.Values.sandbox.cpuOvercommit | quote }}
            - name: KUBE_MEMORY_OVERCOMMIT
              value: {{ $root.Values.sandbox.memoryOvercommit | quote }}
            {{- with $root.Values.sandbox.workloadTolerations }}
            - name: KUBE_WORKLOAD_TOLERATIONS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with $root.Values.sandbox.workloadNodeSelector }}
            - name: KUBE_WORKLOAD_NODE_SELECTOR
              value: {{ toJson . | quote }}
            {{- end }}
            {{- include "orchestrator.s3Env" (dict "s3" $root.Values.sandbox.s3 "secretName" (include "orchestrator.sandboxS3SecretName" $root)) | nindent 12 }}
            {{- end }}
            {{- if $root.Values.poolController.leaderElection.enabled }}
            - name: KUBE_POOL_LEADER_ELECTION
              value: "true"
            - name: KUBE_POOL_LEADER_LEASE_NAME
              value: {{ printf "%s-%s" (default (include "orchestrator.poolControllerName" $root) $root.Values.poolController.leaderElection.leaseName) $kind | quote }}
            - name: KUBE_POOL_LEADER_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KUBE_POOL_LEADER_LEASE_DURATION
              value: {{ printf "%ds" (int $root.Values.poolController.leaderElection.leaseDurationSeconds) | quote }}
            - name: KUBE_POOL_LEADER_RENEW_DEADLINE
              value: {{ printf "%ds" (int $root.Values.poolController.leaderElection.renewDeadlineSeconds) | quote }}
            - name: KUBE_POOL_LEADER_RETRY_PERIOD
              value: {{ printf "%ds" (int $root.Values.poolController.leaderElection.retryPeriodSeconds) | quote }}
            {{- end }}
            {{- if $root.Values.orchestrator.sidecarImagePullPolicy }}
            - name: KUBE_SIDECAR_IMAGE_PULL_POLICY
              value: {{ $root.Values.orchestrator.sidecarImagePullPolicy | quote }}
            {{- end }}
            {{- if $root.Values.orchestrator.workerImagePullPolicy }}
            - name: KUBE_WORKER_IMAGE_PULL_POLICY
              value: {{ $root.Values.orchestrator.workerImagePullPolicy | quote }}
            {{- end }}
            {{- with $root.Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml $root.Values.poolController.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
{{- if gt (int $root.Values.poolController.replicaCount) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "orchestrator.poolControllerLabels" $root | nindent 4 }}
    orchestrator.open-runtimes.io/pool-kind: {{ $kind }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "orchestrator.poolControllerSelectorLabels" $root | nindent 6 }}
      orchestrator.open-runtimes.io/pool-kind: {{ $kind }}
{{- end }}
{{- end -}}

{{- if and .Values.poolController.enabled (or .Values.deployments.enabled .Values.sandbox.enabled) }}
{{- if and (gt (int .Values.poolController.replicaCount) 1) (not .Values.poolController.leaderElection.enabled) }}
{{- fail "poolController.replicaCount > 1 requires poolController.leaderElection.enabled=true" }}
{{- end }}
{{- if .Values.deployments.enabled }}
{{ include "orchestrator.poolControllerDeployment" (dict "root" . "kind" "revision") }}
{{- end }}
{{- if and .Values.deployments.enabled .Values.sandbox.enabled }}
---
{{- end }}
{{- if .Values.sandbox.enabled }}
{{ include "orchestrator.poolControllerDeployment" (dict "root" . "kind" "sandbox") }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orchestrator.poolControllerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.poolControllerLabels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "orchestrator.poolControllerName" . }}
  namespace: {{ include "orchestrator.workloadNamespace" . }}
  labels:
    {{- include "orchestrator.poolControllerLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
  {{- if .Values.poolController.leaderElection.enabled }}
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "orchestrator.poolControllerName" . }}
  namespace: {{ include "orchestrator.workloadNamespace" . }}
  labels:
    {{- include "orchestrator.poolControllerLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "orchestrator.poolControllerName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "orchestrator.poolControllerName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "orchestrator.poolControllerName" . }}
  labels:
    {{- include "orchestrator.poolControllerLabels" . | nindent 4 }}
rules:
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "orchestrator.poolControllerName" . }}
  labels:
    {{- include "orchestrator.poolControllerLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "orchestrator.poolControllerName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "orchestrator.poolControllerName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
