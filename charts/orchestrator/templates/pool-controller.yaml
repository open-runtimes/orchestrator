{{- /*
Warm-pod inventory: one pool controller per enabled plane, each with its own
ServiceAccount allowed only in that plane's namespace.
*/}}
{{- if .Values.poolController.enabled }}
{{- range $kind, $plane := dict "revision" "deployments" "sandbox" "sandbox" }}
{{- with $ }}
{{- if index .Values $plane "enabled" }}
{{- $values := deepCopy .Values.poolController }}
{{- with $values.serviceAccount.name }}
{{- $_ := set $values.serviceAccount "name" (printf "%s-%s" . $kind) }}
{{- end }}
{{- $c := dict "root" . "component" (printf "pool-controller-%s" $kind) "values" $values }}
---
{{ include "orchestrator.component" (merge (dict
  "container" "pool-controller"
  "ports" (list (dict "name" "health" "port" 8080))
  "probe" (dict "port" "health" "readiness" "/readyz" "liveness" "/livez")
  "env" (include "orchestrator.poolControllerEnv" (dict "root" . "kind" $kind "plane" $plane))
  "s3" (index .Values $plane "s3")
  "leader" true) $c) }}
{{- include "orchestrator.rbac" (merge (dict "namespace" (include "orchestrator.planeNamespace" (dict "root" . "plane" $plane)) "name" (include "orchestrator.componentName" $c) "rules" (include "orchestrator.poolControllerRules" .)) $c) }}
{{- include "orchestrator.runtimeClassReader" $c }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- define "orchestrator.poolControllerEnv" -}}
{{- $root := .root -}}
{{- $v := $root.Values.poolController -}}
- name: POOL_KIND
  value: {{ .kind | quote }}
- name: HEALTH_PORT
  value: "8080"
{{- include "orchestrator.workloadEnv" (dict "root" $root "plane" .plane) }}
- name: WORKLOAD_SIDECAR_IMAGE
  value: {{ include "orchestrator.image" (dict "root" $root "image" $root.Values.images.workloadSidecar) | quote }}
- name: POOL_SHIM_IMAGE
  value: {{ include "orchestrator.image" (dict "root" $root "image" $root.Values.images.poolShim) | quote }}
{{- if eq .kind "revision" }}
- name: POOLS_JSON
  value: {{ toJson $root.Values.deployments.pools | quote }}
{{- else }}
- name: SANDBOX_POOLS_JSON
  value: {{ toJson $root.Values.sandbox.pools | quote }}
- name: SANDBOX_AGENT_IMAGE
  value: {{ include "orchestrator.image" (dict "root" $root "image" $root.Values.images.sandboxAgent) | quote }}
{{- end }}
{{- include "orchestrator.leaderEnv" (dict "values" $v.leaderElection "lease" (printf "%s-%s" (default (include "orchestrator.componentName" (dict "root" $root "component" "pool-controller")) $v.leaderElection.leaseName) .kind) "prefix" "KUBE_POOL_") }}
{{- include "orchestrator.s3Env" (dict "root" $root "plane" .plane) }}
{{- end -}}

{{- define "orchestrator.poolControllerRules" -}}
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create"]
{{- if .Values.poolController.leaderElection.enabled }}
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
{{- end }}
{{- end -}}
