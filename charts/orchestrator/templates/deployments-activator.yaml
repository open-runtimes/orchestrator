{{- if and .Values.deployments.enabled .Values.deployments.activator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}-activator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.activatorLabels" . | nindent 4 }}
spec:
  {{- if not .Values.deployments.activator.autoscaling.enabled }}
  replicas: {{ .Values.deployments.activator.replicaCount }}
  {{- end }}
  strategy:
    {{- include "orchestrator.rolloutStrategy" . | nindent 4 }}
  selector:
    matchLabels:
      {{- include "orchestrator.activatorSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orchestrator.activatorSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "orchestrator.deploymentsName" . }}-activator
      {{- with include "orchestrator.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- include "orchestrator.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "orchestrator.activatorSelectorLabels" . | nindent 14 }}
      volumes:
        # Scratch space so readOnlyRootFilesystem never bites a stray temp
        # write (the services themselves write nothing).
        - name: tmp
          emptyDir: {}
      containers:
        - name: deployments-activator
          image: {{ include "orchestrator.activatorImage" . | quote }}
          imagePullPolicy: {{ .Values.deployments.activator.image.pullPolicy }}
          securityContext:
            {{- include "orchestrator.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: data
              containerPort: {{ .Values.deployments.activator.port }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          env:
            - name: ACTIVATOR_PORT
              value: {{ .Values.deployments.activator.port | quote }}
            - name: METRICS_PORT
              value: {{ .Values.service.metricsPort | quote }}
            - name: KUBE_NAMESPACE
              value: {{ include "orchestrator.workloadNamespace" . | quote }}
            - name: KUBE_CLIENT_QPS
              value: {{ .Values.deployments.clientQPS | quote }}
            - name: KUBE_CLIENT_BURST
              value: {{ .Values.deployments.clientBurst | quote }}
            - name: SHUTDOWN_DRAIN_WAIT
              value: "0s"
          readinessProbe:
            httpGet:
              path: /healthz
              port: data
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: data
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.deployments.activator.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: deployments-activator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.activatorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "orchestrator.activatorSelectorLabels" . | nindent 4 }}
  ports:
    - name: data
      port: {{ .Values.deployments.activator.port }}
      targetPort: data
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}-activator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.activatorLabels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}-activator
  namespace: {{ include "orchestrator.workloadNamespace" . }}
  labels:
    {{- include "orchestrator.activatorLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["orchestrator.open-runtimes.io"]
    resources: ["revisions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["orchestrator.open-runtimes.io"]
    resources: ["revisions/scale"]
    verbs: ["get", "update", "patch"]
  # Async requests read the deployment's callback config off its dep-{id}
  # spec Secret (secret material never rests on ConfigMaps).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}-activator
  namespace: {{ include "orchestrator.workloadNamespace" . }}
  labels:
    {{- include "orchestrator.activatorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "orchestrator.deploymentsName" . }}-activator
subjects:
  - kind: ServiceAccount
    name: {{ include "orchestrator.deploymentsName" . }}-activator
    namespace: {{ .Release.Namespace }}

{{- /*
Replica-aware PDB — see the jobs PDB note; singletons never get one.
*/}}
{{- if or (gt (int .Values.deployments.activator.replicaCount) 1) (and .Values.deployments.activator.autoscaling.enabled (gt (int .Values.deployments.activator.autoscaling.minReplicas) 1)) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}-activator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.activatorLabels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "orchestrator.activatorSelectorLabels" . | nindent 6 }}
{{- end }}
{{- if .Values.deployments.activator.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}-activator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.activatorLabels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "orchestrator.deploymentsName" . }}-activator
  minReplicas: {{ .Values.deployments.activator.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.deployments.activator.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.deployments.activator.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
