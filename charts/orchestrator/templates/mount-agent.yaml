{{- if .Values.mountAgent.enabled }}
{{- $c := dict "root" . "component" "mount-agent" -}}
{{- $name := include "orchestrator.componentName" $c -}}
{{- $driver := "mount.open-runtimes.dev" -}}
{{- $pluginDir := printf "/var/lib/kubelet/plugins/%s" $driver -}}
{{- $namespaces := list -}}
{{- $tolerations := list -}}
{{- range $plane := list "jobs" "deployments" "sandbox" -}}
{{- if (index $.Values $plane "enabled") -}}
{{- $namespaces = append $namespaces (include "orchestrator.planeNamespace" (dict "root" $ "plane" $plane)) -}}
{{- $tolerations = concat $tolerations (index $.Values $plane "workload" "tolerations") -}}
{{- end -}}
{{- end -}}
{{- if not $namespaces }}{{ fail "mountAgent.enabled needs jobs, deployments or sandbox enabled" }}{{ end -}}
# Inline ephemeral volumes only: each mounting pod's workspace is created on
# publish and destroyed on unpublish, so there is no controller to attach.
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: {{ $driver }}
  labels:
    {{- include "orchestrator.labels" $c | nindent 4 }}
spec:
  attachRequired: false
  podInfoOnMount: true
  volumeLifecycleModes: [Ephemeral]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.labels" $c | nindent 4 }}
spec:
  # Kept to instance and component, without the name label the other
  # selectors carry: a DaemonSet selector is immutable.
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mount-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mount-agent
      {{- with .Values.mountAgent.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # The mount API listens on the node's own IP, which is where sidecars
      # reach it (status.hostIP); the workspace token is the boundary.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.mountAgent.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.mountAgent.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mountAgent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mountAgent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mountAgent.tolerations | default ($tolerations | uniq) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mount-agent
          image: {{ include "orchestrator.image" (dict "root" . "image" .Values.mountAgent.image) | quote }}
          imagePullPolicy: {{ .Values.mountAgent.image.pullPolicy }}
          # Loop devices, mount(2), and propagation into kubelet's pod
          # directories: privileged here, so that no workload pod has to be.
          securityContext:
            privileged: true
            runAsUser: 0
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: NODE_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - name: LISTEN_ADDR
              value: "$(NODE_IP):{{ .Values.mountAgent.port }}"
            # Only the namespaces of enabled planes: an empty list would let any
            # namespace use the driver.
            - name: ALLOWED_NAMESPACES
              value: {{ $namespaces | uniq | join "," | quote }}
          ports:
            - name: api
              containerPort: {{ .Values.mountAgent.port }}
          livenessProbe:
            httpGet: {path: /healthz, port: api}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.mountAgent.resources | nindent 12 }}
          volumeMounts:
            # Same path as on the host, Bidirectional: the workspace binds and
            # artifact mounts made here must reach kubelet and the pods. The
            # agent's socket and state live in its plugin directory under it.
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: dev
              mountPath: /dev
        - name: registrar
          image: {{ include "orchestrator.image" (dict "root" . "image" .Values.images.csiRegistrar) | quote }}
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ $pluginDir }}/csi.sock
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 32Mi}
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
      volumes:
        - name: kubelet-dir
          hostPath: {path: /var/lib/kubelet, type: Directory}
        - name: plugin-dir
          hostPath: {path: {{ $pluginDir }}, type: DirectoryOrCreate}
        - name: registration-dir
          hostPath: {path: /var/lib/kubelet/plugins_registry, type: Directory}
        - name: dev
          hostPath: {path: /dev, type: Directory}
{{- end }}
