{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "orchestrator.jobsName" . }}
  namespace: {{ include "orchestrator.jobNamespace" . }}
  labels:
    {{- include "orchestrator.jobsLabels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  {{- if .Values.leaderElection.enabled }}
  # Lease for leader election across replicas.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "orchestrator.jobsName" . }}
  namespace: {{ include "orchestrator.jobNamespace" . }}
  labels:
    {{- include "orchestrator.jobsLabels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "orchestrator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "orchestrator.jobsName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
