{{- /*
  One hardened namespace per enabled workload plane, so sandboxes (untrusted
  code) and deployments never share a namespace, isolation policy or quota.
*/}}
{{- if .Values.workloadNamespace.enabled }}
{{- range $plane := list "deployments" "sandbox" }}
{{- with $ }}
{{- if index .Values $plane "enabled" }}
{{- $ns := include (printf "orchestrator.%sNamespace" $plane) . }}
{{- if .Values.workloadNamespace.create }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
    {{- with .Values.workloadNamespace.podSecurity }}
    pod-security.kubernetes.io/enforce: {{ . }}
    pod-security.kubernetes.io/audit: {{ . }}
    pod-security.kubernetes.io/warn: {{ . }}
    {{- end }}
{{- end }}
{{- if .Values.workloadNamespace.networkPolicy.enabled }}
---
# Workload isolation: default-deny ingress to the plane's pods, admitting only
# its data path (the gateway and activator for deployments, the sandbox proxy
# for sandboxes) and its control planes (claim POSTs, /stats scrapes, direct
# probes).
# Egress blocks the cloud metadata endpoint — the highest-value single rule
# (docs/operations.md). Requires an enforcing CNI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "orchestrator.fullname" . }}-{{ $plane }}-isolation
  namespace: {{ $ns }}
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      managed-by: {{ $plane }}-service
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        {{- if eq $plane "deployments" }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.workloadNamespace.networkPolicy.gatewayNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: deployments-activator
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: deployments
        {{- end }}
        {{- if .Values.poolController.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: pool-controller
              orchestrator.open-runtimes.io/pool-kind: {{ ternary "revision" "sandbox" (eq $plane "deployments") }}
        {{- end }}
        {{- if eq $plane "sandbox" }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: sandbox
        {{- end }}
        {{- if and (eq $plane "sandbox") .Values.sandbox.proxy.enabled }}
        # The sandbox proxy is permanently on the data path for sandbox pods.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: sandbox-proxy
        {{- end }}
  egress:
    # DNS anywhere in-cluster (kube-dns lives in kube-system).
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Everything else except the cloud metadata endpoint (IAM-credential SSRF).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: ["169.254.169.254/32"]
{{- end }}
{{- if and (eq $plane "deployments") (ne $ns .Release.Namespace) }}
---
# The cold endpoint flip watches activator pods, which stay with the control
# plane in the release namespace — the service's workload-namespace Role
# cannot see them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}-activator-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.deploymentsLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}-activator-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.deploymentsLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "orchestrator.deploymentsName" . }}-activator-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "orchestrator.deploymentsName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.deployments.gateway.enabled }}
---
# HTTPRoutes in the workload namespace point their Prefer: respond-async rule
# at the activator Service here; cross-namespace backendRefs need the target
# namespace's consent.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}-activator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.deploymentsLabels" . | nindent 4 }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ $ns }}
  to:
    - group: ""
      kind: Service
      name: deployments-activator
{{- end }}
{{- end }}
{{- if .Values.workloadNamespace.resourceQuota.enabled }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "orchestrator.fullname" . }}-{{ $plane }}
  namespace: {{ $ns }}
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
spec:
  hard:
    pods: {{ .Values.workloadNamespace.resourceQuota.pods | quote }}
    requests.cpu: {{ .Values.workloadNamespace.resourceQuota.requestsCpu | quote }}
    requests.memory: {{ .Values.workloadNamespace.resourceQuota.requestsMemory | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
