{{- if .Values.sandboxes.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orchestrator.sandboxesName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.sandboxesLabels" . | nindent 4 }}
spec:
  {{- if and (gt (int .Values.sandboxes.replicaCount) 1) (not .Values.sandboxes.leaderElection.enabled) }}
  {{- fail "sandboxes.replicaCount > 1 requires sandboxes.leaderElection.enabled=true (pool replenishment and GC must be leader-gated)" }}
  {{- end }}
  {{- if not .Values.sandboxes.autoscaling.enabled }}
  replicas: {{ .Values.sandboxes.replicaCount }}
  {{- end }}
  strategy:
    {{- include "orchestrator.rolloutStrategy" . | nindent 4 }}
  selector:
    matchLabels:
      {{- include "orchestrator.sandboxesSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orchestrator.sandboxesSelectorLabels" . | nindent 8 }}
      {{- with include "orchestrator.podAnnotations" (dict "annotations" .Values.sandboxes.podAnnotations "s3" .Values.sandboxes.s3) }}
      {{- . | nindent 6 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "orchestrator.sandboxesName" . }}
      {{- with include "orchestrator.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- include "orchestrator.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "orchestrator.sandboxesSelectorLabels" . | nindent 14 }}
      volumes:
        # Scratch space so readOnlyRootFilesystem never bites a stray temp
        # write (the services themselves write nothing).
        - name: tmp
          emptyDir: {}
        {{- if .Values.sandboxes.auth.existingSecret }}
        - name: auth
          secret:
            secretName: {{ .Values.sandboxes.auth.existingSecret }}
        {{- end }}
      containers:
        - name: sandboxes-service
          image: {{ include "orchestrator.sandboxesImage" . | quote }}
          imagePullPolicy: {{ .Values.sandboxes.image.pullPolicy }}
          securityContext:
            {{- include "orchestrator.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.sandboxes.auth.existingSecret }}
            - name: auth
              mountPath: /var/run/secrets/orchestrator
              readOnly: true
            {{- end }}
          ports:
            - name: api
              containerPort: {{ .Values.service.apiPort }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          env:
            - name: ORCHESTRATOR_BACKEND
              value: kubernetes
            - name: PORT
              value: {{ .Values.service.apiPort | quote }}
            - name: METRICS_PORT
              value: {{ .Values.service.metricsPort | quote }}
            - name: SANDBOX_DOMAIN
              value: {{ required "sandboxes.domain is required when sandboxes.enabled (the wildcard domain sandboxes are addressed at)" .Values.sandboxes.domain | quote }}
            - name: SANDBOX_SCHEME
              value: {{ .Values.sandboxes.scheme | quote }}
            {{- if .Values.sandboxes.pools }}
            - name: SANDBOX_POOLS_JSON
              value: {{ .Values.sandboxes.pools | toJson | quote }}
            {{- end }}
            - name: SANDBOX_AGENT_IMAGE
              value: {{ include "orchestrator.sandboxAgentImage" . | quote }}
            - name: WORKLOAD_SIDECAR_IMAGE
              value: {{ include "orchestrator.workloadSidecarImage" . | quote }}
            - name: POOL_SHIM_IMAGE
              value: {{ include "orchestrator.poolShimImage" . | quote }}
            - name: KUBE_NAMESPACE
              value: {{ include "orchestrator.workloadNamespace" . | quote }}
            - name: KUBE_CPU_OVERCOMMIT
              value: {{ .Values.sandboxes.cpuOvercommit | quote }}
            - name: KUBE_MEMORY_OVERCOMMIT
              value: {{ .Values.sandboxes.memoryOvercommit | quote }}
            {{- with .Values.sandboxes.workloadTolerations }}
            - name: KUBE_WORKLOAD_TOLERATIONS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .Values.sandboxes.workloadNodeSelector }}
            - name: KUBE_WORKLOAD_NODE_SELECTOR
              value: {{ toJson . | quote }}
            {{- end }}
            {{- if .Values.sandboxes.leaderElection.enabled }}
            - name: KUBE_LEADER_ELECTION
              value: "true"
            - name: KUBE_LEADER_LEASE_NAME
              value: {{ default (printf "%s-leader" (include "orchestrator.sandboxesName" .)) .Values.sandboxes.leaderElection.leaseName | quote }}
            - name: KUBE_LEADER_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KUBE_LEADER_LEASE_DURATION
              value: {{ printf "%ds" (int .Values.sandboxes.leaderElection.leaseDurationSeconds) | quote }}
            - name: KUBE_LEADER_RENEW_DEADLINE
              value: {{ printf "%ds" (int .Values.sandboxes.leaderElection.renewDeadlineSeconds) | quote }}
            - name: KUBE_LEADER_RETRY_PERIOD
              value: {{ printf "%ds" (int .Values.sandboxes.leaderElection.retryPeriodSeconds) | quote }}
            {{- end }}
            {{- if .Values.orchestrator.sidecarImagePullPolicy }}
            - name: KUBE_SIDECAR_IMAGE_PULL_POLICY
              value: {{ .Values.orchestrator.sidecarImagePullPolicy | quote }}
            {{- end }}
            {{- if .Values.orchestrator.workerImagePullPolicy }}
            - name: KUBE_WORKER_IMAGE_PULL_POLICY
              value: {{ .Values.orchestrator.workerImagePullPolicy | quote }}
            {{- end }}
            - name: SHUTDOWN_DRAIN_WAIT
              value: "0s"
            {{- include "orchestrator.s3Env" (dict "s3" .Values.sandboxes.s3 "secretName" (include "orchestrator.sandboxesS3SecretName" .)) | nindent 12 }}
            {{- if .Values.sandboxes.auth.existingSecret }}
            - name: API_KEY_FILE
              value: /var/run/secrets/orchestrator/{{ .Values.sandboxes.auth.secretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.sandboxes.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orchestrator.sandboxesName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.sandboxesLabels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "orchestrator.sandboxesSelectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.service.apiPort }}
      targetPort: api
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orchestrator.sandboxesName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.sandboxesLabels" . | nindent 4 }}
---
{{- /*
Far narrower than the deployments Role: sandboxes are pods claimed from warm
capacity, so there are no Deployments, Services, routes, or PDBs to manage.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "orchestrator.sandboxesName" . }}
  namespace: {{ include "orchestrator.workloadNamespace" . }}
  labels:
    {{- include "orchestrator.sandboxesLabels" . | nindent 4 }}
rules:
  # Create/claim/discard warm pods.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The sandbox-claim-key install key that claim tokens derive from.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]
  {{- if .Values.sandboxes.leaderElection.enabled }}
  # Lease for leader election across replicas.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "orchestrator.sandboxesName" . }}
  namespace: {{ include "orchestrator.workloadNamespace" . }}
  labels:
    {{- include "orchestrator.sandboxesLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "orchestrator.sandboxesName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "orchestrator.sandboxesName" . }}
    namespace: {{ .Release.Namespace }}
---
# Isolation tiers (docs/operations.md): the service validates a sandbox's
# RuntimeClass exists before replenishing pools. RuntimeClasses are
# cluster-scoped, so this is the service's one cluster-scoped grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "orchestrator.sandboxesName" . }}-cluster
  labels:
    {{- include "orchestrator.sandboxesLabels" . | nindent 4 }}
rules:
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "orchestrator.sandboxesName" . }}-cluster
  labels:
    {{- include "orchestrator.sandboxesLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "orchestrator.sandboxesName" . }}-cluster
subjects:
  - kind: ServiceAccount
    name: {{ include "orchestrator.sandboxesName" . }}
    namespace: {{ .Release.Namespace }}

{{- /*
Replica-aware PDB — see the jobs PDB note; singletons never get one.
*/}}
{{- if or (gt (int .Values.sandboxes.replicaCount) 1) (and .Values.sandboxes.autoscaling.enabled (gt (int .Values.sandboxes.autoscaling.minReplicas) 1)) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "orchestrator.sandboxesName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.sandboxesLabels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "orchestrator.sandboxesSelectorLabels" . | nindent 6 }}
{{- end }}
{{- if .Values.sandboxes.autoscaling.enabled }}
{{- if not .Values.sandboxes.leaderElection.enabled }}
{{- fail "sandboxes.autoscaling.enabled requires sandboxes.leaderElection.enabled=true" }}
{{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "orchestrator.sandboxesName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.sandboxesLabels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "orchestrator.sandboxesName" . }}
  minReplicas: {{ .Values.sandboxes.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.sandboxes.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.sandboxes.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
