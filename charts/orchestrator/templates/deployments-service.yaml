{{- if .Values.deployments.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.deploymentsLabels" . | nindent 4 }}
spec:
  {{- if and (gt (int .Values.deployments.replicaCount) 1) (not .Values.deployments.leaderElection.enabled) }}
  {{- fail "deployments.replicaCount > 1 requires deployments.leaderElection.enabled=true (the reconcilers must be leader-gated)" }}
  {{- end }}
  {{- if not .Values.deployments.autoscaling.enabled }}
  replicas: {{ .Values.deployments.replicaCount }}
  {{- end }}
  strategy:
    {{- include "orchestrator.rolloutStrategy" . | nindent 4 }}
  selector:
    matchLabels:
      {{- include "orchestrator.deploymentsSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orchestrator.deploymentsSelectorLabels" . | nindent 8 }}
      {{- with include "orchestrator.podAnnotations" (dict "annotations" .Values.deployments.podAnnotations "s3" .Values.deployments.s3) }}
      {{- . | nindent 6 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "orchestrator.deploymentsName" . }}
      {{- with include "orchestrator.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- include "orchestrator.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "orchestrator.deploymentsSelectorLabels" . | nindent 14 }}
      volumes:
        # Scratch space so readOnlyRootFilesystem never bites a stray temp
        # write (the services themselves write nothing).
        - name: tmp
          emptyDir: {}
        {{- if .Values.deployments.auth.existingSecret }}
        - name: auth
          secret:
            secretName: {{ .Values.deployments.auth.existingSecret }}
        {{- end }}
      containers:
        - name: deployments-service
          image: {{ include "orchestrator.deploymentsImage" . | quote }}
          imagePullPolicy: {{ .Values.deployments.image.pullPolicy }}
          securityContext:
            {{- include "orchestrator.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.deployments.auth.existingSecret }}
            - name: auth
              mountPath: /var/run/secrets/orchestrator
              readOnly: true
            {{- end }}
          ports:
            - name: api
              containerPort: {{ .Values.service.apiPort }}
            - name: data
              containerPort: {{ .Values.deployments.dataPort }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          env:
            - name: ORCHESTRATOR_BACKEND
              value: kubernetes
            - name: PORT
              value: {{ .Values.service.apiPort | quote }}
            - name: DATA_PORT
              value: {{ .Values.deployments.dataPort | quote }}
            - name: METRICS_PORT
              value: {{ .Values.service.metricsPort | quote }}
            - name: DEPLOYMENTS_DOMAIN
              value: {{ .Values.deployments.domain | quote }}
            - name: WORKLOAD_SIDECAR_IMAGE
              value: {{ include "orchestrator.workloadSidecarImage" . | quote }}
            - name: JOB_SIDECAR_IMAGE
              value: {{ include "orchestrator.jobSidecarImage" . | quote }}
            - name: KUBE_NAMESPACE
              value: {{ include "orchestrator.workloadNamespace" . | quote }}
            - name: KUBE_ACTIVATOR_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: KUBE_GATEWAY_ENABLED
              value: {{ .Values.deployments.gateway.enabled | quote }}
            - name: KUBE_GATEWAY_NAME
              value: {{ .Values.deployments.gateway.name | quote }}
            - name: KUBE_GATEWAY_NAMESPACE
              value: {{ default .Release.Namespace .Values.deployments.gateway.namespace | quote }}
            - name: ACTIVATOR_SERVICE
              value: "deployments-activator"
            - name: ACTIVATOR_PORT
              value: {{ .Values.deployments.activator.port | quote }}
            - name: KUBE_CPU_OVERCOMMIT
              value: {{ .Values.deployments.cpuOvercommit | quote }}
            - name: KUBE_MEMORY_OVERCOMMIT
              value: {{ .Values.deployments.memoryOvercommit | quote }}
            - name: KUBE_REVISION_WORKERS
              value: {{ .Values.deployments.revisionWorkers | quote }}
            - name: KUBE_CLIENT_QPS
              value: {{ .Values.deployments.clientQPS | quote }}
            - name: KUBE_CLIENT_BURST
              value: {{ .Values.deployments.clientBurst | quote }}
            {{- with .Values.deployments.workloadTolerations }}
            - name: KUBE_WORKLOAD_TOLERATIONS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .Values.deployments.workloadNodeSelector }}
            - name: KUBE_WORKLOAD_NODE_SELECTOR
              value: {{ toJson . | quote }}
            {{- end }}
            {{- if .Values.deployments.pools }}
            - name: POOLS_JSON
              value: {{ .Values.deployments.pools | toJson | quote }}
            - name: POOL_SHIM_IMAGE
              value: {{ include "orchestrator.poolShimImage" . | quote }}
            {{- end }}
            {{- if .Values.deployments.leaderElection.enabled }}
            - name: KUBE_LEADER_ELECTION
              value: "true"
            - name: KUBE_LEADER_LEASE_NAME
              value: {{ default (printf "%s-leader" (include "orchestrator.deploymentsName" .)) .Values.deployments.leaderElection.leaseName | quote }}
            - name: KUBE_LEADER_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KUBE_LEADER_LEASE_DURATION
              value: {{ printf "%ds" (int .Values.deployments.leaderElection.leaseDurationSeconds) | quote }}
            - name: KUBE_LEADER_RENEW_DEADLINE
              value: {{ printf "%ds" (int .Values.deployments.leaderElection.renewDeadlineSeconds) | quote }}
            - name: KUBE_LEADER_RETRY_PERIOD
              value: {{ printf "%ds" (int .Values.deployments.leaderElection.retryPeriodSeconds) | quote }}
            {{- end }}
            {{- if .Values.orchestrator.sidecarImagePullPolicy }}
            - name: KUBE_SIDECAR_IMAGE_PULL_POLICY
              value: {{ .Values.orchestrator.sidecarImagePullPolicy | quote }}
            {{- end }}
            {{- if .Values.orchestrator.workerImagePullPolicy }}
            - name: KUBE_WORKER_IMAGE_PULL_POLICY
              value: {{ .Values.orchestrator.workerImagePullPolicy | quote }}
            {{- end }}
            - name: SHUTDOWN_DRAIN_WAIT
              value: "0s"
            {{- include "orchestrator.s3Env" (dict "s3" .Values.deployments.s3 "secretName" (include "orchestrator.deploymentsS3SecretName" .)) | nindent 12 }}
            {{- if .Values.deployments.auth.existingSecret }}
            - name: API_KEY_FILE
              value: /var/run/secrets/orchestrator/{{ .Values.deployments.auth.secretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.deployments.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.deploymentsLabels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "orchestrator.deploymentsSelectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.service.apiPort }}
      targetPort: api
    - name: data
      port: {{ .Values.deployments.dataPort }}
      targetPort: data
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.deploymentsLabels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}
  namespace: {{ include "orchestrator.workloadNamespace" . }}
  labels:
    {{- include "orchestrator.deploymentsLabels" . | nindent 4 }}
rules:
  - apiGroups: ["orchestrator.open-runtimes.io"]
    resources: ["revisions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["orchestrator.open-runtimes.io"]
    resources: ["revisions/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["orchestrator.open-runtimes.io"]
    resources: ["revisions/scale"]
    verbs: ["get", "update", "patch"]
  # Replica Pods set blockOwnerDeletion on their Revision; the
  # OwnerReferencesPermissionEnforcement admission plugin (on by default on
  # OpenShift) rejects that unless the creator may update the owner's finalizers.
  - apiGroups: ["orchestrator.open-runtimes.io"]
    resources: ["revisions/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Revision reconciliation creates direct pods and creates/claims/discards warm pods.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Secret material at rest (docs/operations.md): per-deployment spec
  # Secrets (dep-{id}, carrying callback signing keys) and the pool-claim-key
  # install key that claim tokens derive from.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Replica-aware PDBs per revision (docs/operations.md).
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- if .Values.deployments.leaderElection.enabled }}
  # Lease for leader election across replicas.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}
  namespace: {{ include "orchestrator.workloadNamespace" . }}
  labels:
    {{- include "orchestrator.deploymentsLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "orchestrator.deploymentsName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "orchestrator.deploymentsName" . }}
    namespace: {{ .Release.Namespace }}
---
# Isolation tiers (docs/operations.md): the service validates a workload's
# RuntimeClass exists before minting revisions / replenishing pools.
# RuntimeClasses are cluster-scoped, so this is the service's one
# cluster-scoped grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}-cluster
  labels:
    {{- include "orchestrator.deploymentsLabels" . | nindent 4 }}
rules:
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}-cluster
  labels:
    {{- include "orchestrator.deploymentsLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "orchestrator.deploymentsName" . }}-cluster
subjects:
  - kind: ServiceAccount
    name: {{ include "orchestrator.deploymentsName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.deployments.limitRange.enabled }}
---
# Default requests/limits for containers that declare none (resource-model.md):
# no BestEffort creep, a memory ceiling, and deliberately NO default cpu limit
# (CFS throttling). Explicit values on managed pods always win.
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.deploymentsLabels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        memory: 512Mi
{{- end }}

{{- /*
Replica-aware PDB — see the jobs PDB note; singletons never get one.
*/}}
{{- if or (gt (int .Values.deployments.replicaCount) 1) (and .Values.deployments.autoscaling.enabled (gt (int .Values.deployments.autoscaling.minReplicas) 1)) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.deploymentsLabels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "orchestrator.deploymentsSelectorLabels" . | nindent 6 }}
{{- end }}
{{- if .Values.deployments.autoscaling.enabled }}
{{- if not .Values.deployments.leaderElection.enabled }}
{{- fail "deployments.autoscaling.enabled requires deployments.leaderElection.enabled=true" }}
{{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.deploymentsLabels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "orchestrator.deploymentsName" . }}
  minReplicas: {{ .Values.deployments.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.deployments.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.deployments.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
