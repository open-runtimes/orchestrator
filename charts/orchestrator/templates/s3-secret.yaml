{{/*
Per-service S3 credential Secrets. Created only when a service enables S3 with
inline values (existingSecret unset). Each service gets its own secret so jobs,
deployments and sandbox credentials stay independent. Named profiles add
S3_<NAME>_ACCESS_KEY_ID / S3_<NAME>_SECRET_ACCESS_KEY to the same secret.
*/}}
{{- range $svc := list "jobs" "deployments" "sandbox" }}
{{- $v := index $.Values $svc }}
{{- if and $v.enabled $v.s3.enabled (not $v.s3.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include (printf "orchestrator.%sS3SecretName" $svc) $ }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include (printf "orchestrator.%sLabels" $svc) $ | nindent 4 }}
type: Opaque
stringData:
  S3_ACCESS_KEY_ID: {{ required (printf "%s.s3.accessKeyId is required when %s.s3.enabled and no existingSecret" $svc $svc) $v.s3.accessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ required (printf "%s.s3.secretAccessKey is required when %s.s3.enabled and no existingSecret" $svc $svc) $v.s3.secretAccessKey | quote }}
  {{- range $name, $p := $v.s3.profiles }}
  S3_{{ upper $name }}_ACCESS_KEY_ID: {{ required (printf "%s.s3.profiles.%s.accessKeyId is required when no existingSecret" $svc $name) $p.accessKeyId | quote }}
  S3_{{ upper $name }}_SECRET_ACCESS_KEY: {{ required (printf "%s.s3.profiles.%s.secretAccessKey is required when no existingSecret" $svc $name) $p.secretAccessKey | quote }}
  {{- end }}
{{- end }}
{{- end }}
