{{- /* A plane's S3 keys, when given inline rather than as an existingSecret. */}}
{{- range $plane := list "jobs" "deployments" "sandbox" }}
{{- $values := index $.Values $plane }}
{{- if and $values.enabled $values.s3.enabled (not $values.s3.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orchestrator.s3SecretName" (dict "root" $ "plane" $plane) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "orchestrator.labels" (dict "root" $ "component" $plane) | nindent 4 }}
type: Opaque
stringData:
  S3_ACCESS_KEY_ID: {{ required (printf "%s.s3.accessKeyId is required with s3.enabled and no existingSecret" $plane) $values.s3.accessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ required (printf "%s.s3.secretAccessKey is required with s3.enabled and no existingSecret" $plane) $values.s3.secretAccessKey | quote }}
{{- end }}
{{- end }}
