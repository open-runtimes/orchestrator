{{/*
Per-service S3 credential Secrets. Created only when a service enables S3 with
inline values (existingSecret unset). Each service gets its own secret so jobs
and deployments credentials stay independent.
*/}}
{{- if and .Values.jobs.enabled .Values.jobs.s3.enabled (not .Values.jobs.s3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orchestrator.jobsName" . }}-s3
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.jobsLabels" . | nindent 4 }}
type: Opaque
stringData:
  S3_ACCESS_KEY_ID: {{ required "jobs.s3.accessKeyId is required when jobs.s3.enabled and no existingSecret" .Values.jobs.s3.accessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ required "jobs.s3.secretAccessKey is required when jobs.s3.enabled and no existingSecret" .Values.jobs.s3.secretAccessKey | quote }}
{{- end }}
{{- if and .Values.deployments.enabled .Values.deployments.s3.enabled (not .Values.deployments.s3.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}-s3
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.deploymentsLabels" . | nindent 4 }}
type: Opaque
stringData:
  S3_ACCESS_KEY_ID: {{ required "deployments.s3.accessKeyId is required when deployments.s3.enabled and no existingSecret" .Values.deployments.s3.accessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ required "deployments.s3.secretAccessKey is required when deployments.s3.enabled and no existingSecret" .Values.deployments.s3.secretAccessKey | quote }}
{{- end }}
{{- if and .Values.sandbox.enabled .Values.sandbox.s3.enabled (not .Values.sandbox.s3.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orchestrator.sandboxName" . }}-s3
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.sandboxLabels" . | nindent 4 }}
type: Opaque
stringData:
  S3_ACCESS_KEY_ID: {{ required "sandbox.s3.accessKeyId is required when sandbox.s3.enabled and no existingSecret" .Values.sandbox.s3.accessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ required "sandbox.s3.secretAccessKey is required when sandbox.s3.enabled and no existingSecret" .Values.sandbox.s3.secretAccessKey | quote }}
{{- end }}
