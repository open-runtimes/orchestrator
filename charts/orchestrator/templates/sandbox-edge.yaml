{{- if and .Values.deployments.enabled .Values.deployments.sandboxes.edge.enabled }}
{{- /*
The sandbox edge: the deployments-activator image in EDGE_MODE=sandbox. One
wildcard HTTPRoute for *.{domain} sends every sandbox here, and it resolves the
sandbox from the capability token in the request's Host. Separate replica set
from the deployments activator on purpose — this one is permanently on the data
path, and a sandbox file upload should not share a failure domain with a
deployment cold start.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}-sandbox-edge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.sandboxEdgeLabels" . | nindent 4 }}
spec:
  {{- if not .Values.deployments.sandboxes.edge.autoscaling.enabled }}
  replicas: {{ .Values.deployments.sandboxes.edge.replicaCount }}
  {{- end }}
  strategy:
    {{- include "orchestrator.rolloutStrategy" . | nindent 4 }}
  selector:
    matchLabels:
      {{- include "orchestrator.sandboxEdgeSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orchestrator.sandboxEdgeSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "orchestrator.deploymentsName" . }}-sandbox-edge
      securityContext:
        {{- include "orchestrator.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "orchestrator.sandboxEdgeSelectorLabels" . | nindent 14 }}
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: sandbox-edge
          image: {{ include "orchestrator.activatorImage" . | quote }}
          imagePullPolicy: {{ .Values.deployments.activator.image.pullPolicy }}
          securityContext:
            {{- include "orchestrator.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: data
              containerPort: {{ .Values.deployments.sandboxes.edge.port }}
            - name: mgmt
              containerPort: {{ .Values.service.apiPort }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          env:
            - name: EDGE_MODE
              value: sandbox
            - name: ACTIVATOR_PORT
              value: {{ .Values.deployments.sandboxes.edge.port | quote }}
            - name: METRICS_PORT
              value: {{ .Values.service.metricsPort | quote }}
            - name: KUBE_NAMESPACE
              value: {{ include "orchestrator.deploymentsWorkloadNamespace" . | quote }}
            - name: SANDBOX_DOMAIN
              value: {{ required "deployments.sandboxes.domain is required when the sandbox edge is enabled" .Values.deployments.sandboxes.domain | quote }}
            - name: SANDBOX_HOLD_SECONDS
              value: {{ .Values.deployments.sandboxes.edge.holdSeconds | quote }}
            - name: PORT
              value: {{ .Values.service.apiPort | quote }}
            - name: SHUTDOWN_DRAIN_WAIT
              value: "0s"
          {{- /*
          Probes hit the management port, not the data port: the data listener
          serves only sandbox traffic, since every path there belongs to the
          sandbox (including the contract's own /healthz).
          */}}
          readinessProbe:
            httpGet:
              path: /healthz
              port: mgmt
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: mgmt
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.deployments.sandboxes.edge.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-edge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.sandboxEdgeLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "orchestrator.sandboxEdgeSelectorLabels" . | nindent 4 }}
  ports:
    - name: data
      port: {{ .Values.deployments.sandboxes.edge.port }}
      targetPort: data
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}-sandbox-edge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.sandboxEdgeLabels" . | nindent 4 }}
---
{{- /*
The edge reads pods only: it resolves a token to the pod carrying it. No
secrets (sandbox traffic is sync — there is no callback config to read), and
nothing writable.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}-sandbox-edge
  namespace: {{ include "orchestrator.deploymentsWorkloadNamespace" . }}
  labels:
    {{- include "orchestrator.sandboxEdgeLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}-sandbox-edge
  namespace: {{ include "orchestrator.deploymentsWorkloadNamespace" . }}
  labels:
    {{- include "orchestrator.sandboxEdgeLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "orchestrator.deploymentsName" . }}-sandbox-edge
subjects:
  - kind: ServiceAccount
    name: {{ include "orchestrator.deploymentsName" . }}-sandbox-edge
    namespace: {{ .Release.Namespace }}
{{- if and .Values.deployments.sandboxes.edge.route.enabled .Values.deployments.gateway.enabled }}
---
{{- /*
One wildcard route for every sandbox that will ever exist. Nothing is
programmed per create or per delete, so creates stay as fast as the claim and
minute-scale sandbox churn never touches the gateway config.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}-sandboxes
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.sandboxEdgeLabels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.deployments.gateway.name }}
      namespace: {{ default .Release.Namespace .Values.deployments.gateway.namespace }}
  hostnames:
    - {{ printf "*.%s" .Values.deployments.sandboxes.domain | quote }}
  rules:
    - backendRefs:
        - name: sandbox-edge
          port: {{ .Values.deployments.sandboxes.edge.port }}
{{- end }}
{{- /*
Replica-aware PDB — see the jobs PDB note; singletons never get one.
*/}}
{{- if or (gt (int .Values.deployments.sandboxes.edge.replicaCount) 1) (and .Values.deployments.sandboxes.edge.autoscaling.enabled (gt (int .Values.deployments.sandboxes.edge.autoscaling.minReplicas) 1)) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}-sandbox-edge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.sandboxEdgeLabels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "orchestrator.sandboxEdgeSelectorLabels" . | nindent 6 }}
{{- end }}
{{- if .Values.deployments.sandboxes.edge.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}-sandbox-edge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.sandboxEdgeLabels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "orchestrator.deploymentsName" . }}-sandbox-edge
  minReplicas: {{ .Values.deployments.sandboxes.edge.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.deployments.sandboxes.edge.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.deployments.sandboxes.edge.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
