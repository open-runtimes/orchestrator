{{- if and .Values.deployments.enabled .Values.deployments.poolController.enabled }}
{{- if and (gt (int .Values.deployments.poolController.replicaCount) 1) (not .Values.deployments.poolController.leaderElection.enabled) }}
{{- fail "deployments.poolController.replicaCount > 1 requires deployments.poolController.leaderElection.enabled=true" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orchestrator.revisionPoolControllerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.revisionPoolControllerLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.deployments.poolController.replicaCount }}
  strategy:
    {{- include "orchestrator.rolloutStrategy" . | nindent 4 }}
  selector:
    matchLabels:
      {{- include "orchestrator.revisionPoolControllerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orchestrator.revisionPoolControllerSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "orchestrator.revisionPoolControllerName" . }}
      {{- with include "orchestrator.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- include "orchestrator.podSecurityContext" . | nindent 8 }}
      containers:
        - name: revision-pool-controller
          image: {{ include "orchestrator.revisionPoolControllerImage" . | quote }}
          imagePullPolicy: {{ .Values.deployments.poolController.image.pullPolicy }}
          securityContext:
            {{- include "orchestrator.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          env:
            - name: METRICS_PORT
              value: {{ .Values.service.metricsPort | quote }}
            - name: KUBE_NAMESPACE
              value: {{ include "orchestrator.workloadNamespace" . | quote }}
            - name: KUBE_CLIENT_QPS
              value: {{ .Values.deployments.clientQPS | quote }}
            - name: KUBE_CLIENT_BURST
              value: {{ .Values.deployments.clientBurst | quote }}
            - name: KUBE_CPU_OVERCOMMIT
              value: {{ .Values.deployments.cpuOvercommit | quote }}
            - name: KUBE_MEMORY_OVERCOMMIT
              value: {{ .Values.deployments.memoryOvercommit | quote }}
            - name: WORKLOAD_SIDECAR_IMAGE
              value: {{ include "orchestrator.workloadSidecarImage" . | quote }}
            - name: POOL_SHIM_IMAGE
              value: {{ include "orchestrator.poolShimImage" . | quote }}
            - name: POOLS_JSON
              value: {{ .Values.deployments.pools | toJson | quote }}
            {{- with .Values.deployments.workloadTolerations }}
            - name: KUBE_WORKLOAD_TOLERATIONS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .Values.deployments.workloadNodeSelector }}
            - name: KUBE_WORKLOAD_NODE_SELECTOR
              value: {{ toJson . | quote }}
            {{- end }}
            {{- if .Values.deployments.poolController.leaderElection.enabled }}
            - name: KUBE_POOL_LEADER_ELECTION
              value: "true"
            - name: KUBE_POOL_LEADER_LEASE_NAME
              value: {{ default (printf "%s-pool-controller-leader" (include "orchestrator.deploymentsName" .)) .Values.deployments.poolController.leaderElection.leaseName | quote }}
            - name: KUBE_POOL_LEADER_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KUBE_POOL_LEADER_LEASE_DURATION
              value: {{ printf "%ds" (int .Values.deployments.poolController.leaderElection.leaseDurationSeconds) | quote }}
            - name: KUBE_POOL_LEADER_RENEW_DEADLINE
              value: {{ printf "%ds" (int .Values.deployments.poolController.leaderElection.renewDeadlineSeconds) | quote }}
            - name: KUBE_POOL_LEADER_RETRY_PERIOD
              value: {{ printf "%ds" (int .Values.deployments.poolController.leaderElection.retryPeriodSeconds) | quote }}
            {{- end }}
            {{- if .Values.orchestrator.sidecarImagePullPolicy }}
            - name: KUBE_SIDECAR_IMAGE_PULL_POLICY
              value: {{ .Values.orchestrator.sidecarImagePullPolicy | quote }}
            {{- end }}
            {{- if .Values.orchestrator.workerImagePullPolicy }}
            - name: KUBE_WORKER_IMAGE_PULL_POLICY
              value: {{ .Values.orchestrator.workerImagePullPolicy | quote }}
            {{- end }}
            {{- include "orchestrator.s3Env" (dict "s3" .Values.deployments.s3 "secretName" (include "orchestrator.deploymentsS3SecretName" .)) | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.deployments.poolController.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orchestrator.revisionPoolControllerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.revisionPoolControllerLabels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "orchestrator.revisionPoolControllerName" . }}
  namespace: {{ include "orchestrator.workloadNamespace" . }}
  labels:
    {{- include "orchestrator.revisionPoolControllerLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
  {{- if .Values.deployments.poolController.leaderElection.enabled }}
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "orchestrator.revisionPoolControllerName" . }}
  namespace: {{ include "orchestrator.workloadNamespace" . }}
  labels:
    {{- include "orchestrator.revisionPoolControllerLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "orchestrator.revisionPoolControllerName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "orchestrator.revisionPoolControllerName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "orchestrator.revisionPoolControllerName" . }}
  labels:
    {{- include "orchestrator.revisionPoolControllerLabels" . | nindent 4 }}
rules:
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "orchestrator.revisionPoolControllerName" . }}
  labels:
    {{- include "orchestrator.revisionPoolControllerLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "orchestrator.revisionPoolControllerName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "orchestrator.revisionPoolControllerName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
