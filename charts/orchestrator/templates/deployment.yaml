apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orchestrator.jobsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.jobsLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "orchestrator.jobsSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orchestrator.jobsSelectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "orchestrator.serviceAccountName" . }}
      containers:
        - name: jobs-service
          image: {{ include "orchestrator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: api
              containerPort: {{ .Values.service.apiPort }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          env:
            - name: ORCHESTRATOR_BACKEND
              value: kubernetes
            - name: PORT
              value: {{ .Values.service.apiPort | quote }}
            - name: METRICS_PORT
              value: {{ .Values.service.metricsPort | quote }}
            - name: KUBE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: KUBE_JOB_SERVICE_ACCOUNT
              value: {{ .Values.serviceAccount.jobSidecarName | quote }}
            - name: SIDECAR_IMAGE
              value: {{ include "orchestrator.sidecarImage" . | quote }}
            - name: ARTIFACT_ENDPOINT
              value: {{ include "orchestrator.artifactEndpoint" . | quote }}
            - name: JOB_RETENTION
              value: {{ .Values.orchestrator.jobRetention | quote }}
            - name: MAINTENANCE_INTERVAL
              value: {{ .Values.orchestrator.maintenanceInterval | quote }}
            - name: KUBE_TERMINATION_GRACE_SECONDS
              value: {{ .Values.orchestrator.terminationGracePeriodSeconds | quote }}
            - name: KUBE_SQUASHFS_MOUNT_ENABLED
              value: {{ .Values.orchestrator.squashfsMountEnabled | quote }}
            {{- if .Values.orchestrator.workerImagePullPolicy }}
            - name: KUBE_WORKER_IMAGE_PULL_POLICY
              value: {{ .Values.orchestrator.workerImagePullPolicy | quote }}
            {{- end }}
            {{- if .Values.orchestrator.sidecarImagePullPolicy }}
            - name: KUBE_SIDECAR_IMAGE_PULL_POLICY
              value: {{ .Values.orchestrator.sidecarImagePullPolicy | quote }}
            {{- end }}
            {{- if .Values.leaderElection.enabled }}
            - name: KUBE_LEADER_ELECTION
              value: "true"
            - name: KUBE_LEADER_LEASE_NAME
              value: {{ include "orchestrator.leaseName" . | quote }}
            - name: KUBE_LEADER_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KUBE_LEADER_LEASE_DURATION
              value: {{ printf "%ds" (int .Values.leaderElection.leaseDurationSeconds) | quote }}
            - name: KUBE_LEADER_RENEW_DEADLINE
              value: {{ printf "%ds" (int .Values.leaderElection.renewDeadlineSeconds) | quote }}
            - name: KUBE_LEADER_RETRY_PERIOD
              value: {{ printf "%ds" (int .Values.leaderElection.retryPeriodSeconds) | quote }}
            {{- end }}
            - name: SHUTDOWN_DRAIN_WAIT
              value: "0s"
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
