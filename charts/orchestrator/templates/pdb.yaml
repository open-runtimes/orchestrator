{{- /*
Replica-aware PodDisruptionBudgets: rendered only for components that are
durably multi-replica (replicaCount > 1 or an HPA that can take them there) —
a PDB on a singleton would block node drains outright. maxUnavailable: 1
keeps quorum-free stateless services available through voluntary disruption.
*/}}
{{- if and .Values.jobs.enabled (or (gt (int .Values.replicaCount) 1) .Values.autoscaling.enabled) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "orchestrator.jobsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.jobsLabels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "orchestrator.jobsSelectorLabels" . | nindent 6 }}
{{- end }}
{{- if .Values.deployments.enabled }}
{{- if or (gt (int .Values.deployments.replicaCount) 1) .Values.deployments.autoscaling.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.deploymentsLabels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "orchestrator.deploymentsSelectorLabels" . | nindent 6 }}
{{- end }}
{{- if and .Values.deployments.activator.enabled (or (gt (int .Values.deployments.activator.replicaCount) 1) .Values.deployments.activator.autoscaling.enabled) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}-activator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.activatorLabels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "orchestrator.activatorSelectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}
