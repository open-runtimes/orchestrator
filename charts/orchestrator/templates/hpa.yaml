{{- /*
HorizontalPodAutoscalers for the control plane. All three services are
stateless (state lives in the cluster), so any replica serves any request;
the jobs and deployments services additionally require leader election so
their background loops stay single-writer while the API scales out.
*/}}
{{- if .Values.autoscaling.enabled }}
{{- if not .Values.leaderElection.enabled }}
{{- fail "autoscaling.enabled requires leaderElection.enabled=true" }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "orchestrator.jobsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.jobsLabels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "orchestrator.jobsName" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.deployments.enabled }}
{{- if .Values.deployments.autoscaling.enabled }}
{{- if not .Values.deployments.leaderElection.enabled }}
{{- fail "deployments.autoscaling.enabled requires deployments.leaderElection.enabled=true" }}
{{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.deploymentsLabels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "orchestrator.deploymentsName" . }}
  minReplicas: {{ .Values.deployments.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.deployments.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.deployments.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.deployments.activator.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "orchestrator.deploymentsName" . }}-activator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.activatorLabels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "orchestrator.deploymentsName" . }}-activator
  minReplicas: {{ .Values.deployments.activator.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.deployments.activator.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.deployments.activator.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
