{{- if .Values.jobs.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "orchestrator.jobsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.jobsLabels" . | nindent 4 }}
spec:
  gatewayClassName: {{ required "jobs.gateway.gatewayClassName is required when jobs.gateway.enabled is true" .Values.jobs.gateway.gatewayClassName }}
  {{- if not .Values.jobs.gateway.listeners }}
  {{- fail "jobs.gateway.listeners must be a non-empty list when jobs.gateway.enabled is true" }}
  {{- end }}
  listeners:
    {{- toYaml .Values.jobs.gateway.listeners | nindent 4 }}
{{- end }}
