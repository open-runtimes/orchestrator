{{- if .Values.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "orchestrator.gatewayName" . }}
  namespace: {{ include "orchestrator.gatewayNamespace" . }}
  labels:
    {{- include "orchestrator.labels" (dict "root" .) | nindent 4 }}
spec:
  gatewayClassName: {{ required "gateway.className is required with gateway.create" .Values.gateway.className }}
  listeners:
    {{- required "gateway.listeners is required with gateway.create" .Values.gateway.listeners | toYaml | nindent 4 }}
{{- end }}
{{- if and .Values.jobs.enabled .Values.jobs.httpRoute.enabled }}
{{- $c := dict "root" . "component" "jobs" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "orchestrator.componentName" $c }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestrator.labels" $c | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "orchestrator.gatewayName" . }}
      namespace: {{ include "orchestrator.gatewayNamespace" . }}
  {{- with .Values.jobs.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "orchestrator.componentName" $c }}
          port: {{ .Values.jobs.service.port }}
{{- end }}
